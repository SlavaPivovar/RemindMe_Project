[project]
name = "tesla-repair-orders"
version = "0.1.0"
description = "AI-помічник для оформлення замовлень-нарядів на ремонт автомобілів Tesla"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3.0", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
tesla-ro = "tesla_ro.cli:main"
tesla-ro-web = "tesla_ro.web:main"

[tool.setuptools.packages.find]
include = ["tesla_ro*"]

[tool.setuptools.package-data]
tesla_ro = ["data/*.json", "static/*.html"]
