[project]
name = "tesla-repair-orders"
version = "0.1.0"
description = "AI-помічник для оформлення замовлень-нарядів на ремонт автомобілів Tesla"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.3.0", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27", "weasyprint>=60", "qrcode>=7.4"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tesla-ro = "tesla_ro.cli:main"
tesla-ro-web = "tesla_ro.web:main"

[tool.setuptools.packages.find]
include = ["tesla_ro*"]

[tool.setuptools.package-data]
tesla_ro = ["data/*.json", "static/*.html"]
