<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DK-Tesla" id="appTitle">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a20" media="(prefers-color-scheme: dark)">
<title>DK-TeslaService</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --text:#16181d; --muted:#6b7280; --line:#e3e5e9;
  --accent:#d32f2f; --accent-ink:#fff; --user:#1f2937; --user-ink:#fff; --bot:#f0f1f4;
  --warn-bg:#fff4e5; --warn:#9a5b00; --ok:#1b7f3b; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#171a20; --text:#e8eaed; --muted:#9aa1ad; --line:#2a2f38;
    --accent:#ef5350; --accent-ink:#fff; --user:#e8eaed; --user-ink:#111; --bot:#20242c;
    --warn-bg:#3a2a10; --warn:#f3b664; --ok:#5fd38a; --shadow:none;
  }
  :root:not([data-theme="light"]) .st-1{color:#93b4ff} :root:not([data-theme="light"]) .st-2{color:#f3b664}
  :root:not([data-theme="light"]) .st-3{color:#5fd38a} :root:not([data-theme="light"]) .st-4{color:#cbd5e1}
  :root:not([data-theme="light"]) .st-5{color:#f87171}
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --text:#e8eaed; --muted:#9aa1ad; --line:#2a2f38;
  --accent:#ef5350; --accent-ink:#fff; --user:#e8eaed; --user-ink:#111; --bot:#20242c;
  --warn-bg:#3a2a10; --warn:#f3b664; --ok:#5fd38a; --shadow:none;
}
:root[data-theme="dark"] .st-1{color:#93b4ff} :root[data-theme="dark"] .st-2{color:#f3b664}
:root[data-theme="dark"] .st-3{color:#5fd38a} :root[data-theme="dark"] .st-4{color:#cbd5e1}
:root[data-theme="dark"] .st-5{color:#f87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 span:not(#brand){color:var(--muted);font-weight:400}
.tabs{display:none;gap:4px;padding:8px 16px 0}
.tabs button{flex:1}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,5fr) 7fr;gap:16px;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column}
#chat .log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;white-space:normal;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.msg.error{align-self:center;background:var(--warn-bg);color:var(--warn);font-size:13px}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}.msg ul{margin:4px 0 6px;padding-left:20px}
.typing{align-self:flex-start;color:var(--muted);font-size:13px}
.typing::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.hints{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.hints button{font-size:12px;padding:4px 10px;border-radius:999px;color:var(--muted)}
form.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
form.composer .mic{display:flex;align-items:center;justify-content:center;width:44px;padding:0;flex:none}
form.composer .mic svg{width:20px;height:20px}
form.composer .mic.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.45)}50%{box-shadow:0 0 0 6px rgba(211,47,47,0)}}
form.composer textarea{flex:1;min-width:0;resize:none;font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);max-height:160px}
#order{overflow:auto}
#order .body{padding:16px 20px}
.empty{color:var(--muted);text-align:center;margin:auto;padding:40px 20px}
.ohead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:12px}
.ohead h2{margin:0;font-size:18px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bot);color:var(--muted)}
.ohead .actions{margin-left:auto;display:flex;gap:6px}
.missing{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.done{color:var(--ok);font-size:13px;margin-bottom:14px}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.info dl{margin:0;display:grid;align-content:start;grid-template-columns:auto 1fr;gap:3px 10px}
.info dt{color:var(--muted)}.info dd{margin:0;overflow-wrap:anywhere}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.r{text-align:right;white-space:nowrap}
ul.plain{margin:0;padding-left:18px}
.totals{margin:14px 0 0 auto;width:max-content;min-width:260px}
.totals div{display:flex;justify-content:space-between;gap:24px;padding:3px 0}
.totals .grand{font-size:16px;font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(760px,calc(100vw - 32px));max-height:80vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .dh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
dialog .dh h2{margin:0;font-size:16px;flex:1}
dialog .db{padding:8px 16px 16px;overflow:auto;max-height:calc(80vh - 60px)}
dialog td button{padding:3px 8px;font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
.filters input,.filters select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.filters input{flex:1;min-width:160px}
.cat-row td{background:var(--bot);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.sub{color:var(--muted);font-size:12px}
.show-m{display:none}
.seg{display:flex;gap:4px;padding:10px 0 2px}
.seg button{flex:1}
.seg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;align-items:center}
.toolbar input,.toolbar select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.toolbar input{flex:1;min-width:150px}
.acts{white-space:nowrap}
.form{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 12px;align-items:start;padding:12px 0}
.form label{color:var(--muted);padding-top:8px}
.form input[type=date],.form input[type=time],.form input[type=text],.form input[type=tel],.form input[type=email],.form input:not([type]),.form select{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.form input:disabled{opacity:.6}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:7px}
.checks label{color:var(--text);padding:0;display:flex;gap:5px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bot);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.chip button{border:0;background:none;padding:0 6px;color:var(--muted)}
.row{display:flex;gap:6px}.row select{flex:1;min-width:0}
.form-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.form-actions .danger{margin-left:auto;color:var(--accent);border-color:var(--accent)}
.form-err{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-top:10px}
.form-ok{color:var(--ok);padding:6px 0}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.visits{display:flex;flex-direction:column;gap:8px}
.visit{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.visit-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.visit-head b{font-weight:600}
.visit-head .sum{margin-left:auto;white-space:nowrap}
.visit-head button{padding:2px 8px;font-size:12px}
.visit ul{margin:4px 0 0;padding-left:18px}
.rec{color:var(--warn)}
select.status{font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid transparent;cursor:pointer}
.status,.st{background:var(--bot);color:var(--muted)}
.st-1{background:rgba(37,99,235,.13);color:#1d4ed8}
.st-2{background:rgba(217,119,6,.15);color:#a35a00}
.st-3{background:rgba(22,163,74,.14);color:#15803d}
.st-4{background:rgba(71,85,105,.16);color:#334155}
.st-5{background:rgba(220,38,38,.12);color:#b91c1c}
.status-log{font-size:12px;color:var(--muted);margin:-6px 0 12px}
.line-add{display:flex;gap:8px;margin-top:8px}
.sec-head{display:flex;align-items:center;gap:8px}
.sec-head h3{flex:1}
.sec-head button,.plain-edit button{padding:2px 8px;font-size:12px}
.plain-edit{list-style:none;padding:0;margin:0}
.plain-edit li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.plain-edit li span{flex:1}
.plain-edit li span::before{content:"• ";color:var(--muted)}
.inline-add{display:flex;gap:6px;margin-top:6px}
.inline-add input{flex:1;min-width:0;font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.inline-add button{padding:4px 12px}
.empty .primary{margin-top:14px}
.form textarea{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-height:110px;resize:vertical}
.internal{margin-top:20px;border:1px dashed var(--line);border-radius:12px;padding:4px 14px 14px;background:var(--bg)}
.internal h3{margin-top:12px}
.comments{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.comment{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.comment .meta{font-size:12px;color:var(--muted);margin-bottom:2px}
.comment .meta b{color:var(--text);font-weight:600}
.comment-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.comment-form input,.comment-form textarea{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);min-width:0}
.comment-form textarea{grid-column:1 / -1;min-height:64px;resize:vertical}
.cc{font-size:11px;color:var(--muted);white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-bottom:10px}
.photo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-width:0}
.photo a{display:block;aspect-ratio:4/3;background:var(--bg)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px;font-size:12px}
.photo select{font:inherit;font-size:12px;padding:3px 4px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0;flex:1 1 100%}
.photo label{display:flex;align-items:center;gap:3px;white-space:nowrap}
.photo button{padding:1px 7px;font-size:12px;margin-left:auto}
.photo-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.photo-add select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.approval{border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px;background:var(--bg);border:1px solid var(--line)}
.approval.ok{color:var(--ok)}
.approval.no,.approval .warn{color:var(--warn)}
.approval .warn{display:block;margin-top:4px}
.tools-sec{border-top:1px solid var(--line);margin-top:18px;padding-top:4px}
.tools-sec .send-row{margin:8px 0}
.import-list{max-height:220px;overflow:auto;font-size:13px;margin:6px 0}
.import-list div{padding:2px 0}
.assignee{display:flex;align-items:center;gap:6px;margin:-4px 0 12px;font-size:13px;color:var(--muted)}
.assignee input{font:inherit;font-size:13px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0;width:240px;max-width:100%}
.comment audio{display:block;width:100%;max-width:340px;height:36px;margin-top:4px}
.bk-agent{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end;padding-top:12px}
.bk-agent .mic{width:42px;height:42px;padding:0;display:grid;place-items:center}
.bk-agent .mic svg{width:20px;height:20px}
.bk-agent .mic.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pulse 1.4s ease-in-out infinite}
.bk-agent textarea{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);resize:vertical;min-width:0}
.bk-log{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.bk-log div{font-size:13px;padding:6px 10px;border-radius:8px;background:var(--bot)}
.bk-log div.me{background:transparent;color:var(--muted);padding:0 2px}
.bk-log div.err{background:var(--warn-bg);color:var(--warn)}
.bk-nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.bk-nav input[type=date]{font:inherit;padding:6px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.bk-nav .bk-new{margin-left:auto}
.bk-day{margin-bottom:12px}
.bk-day h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.bk-day.today h4{color:var(--accent)}
.bk-item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.bk-item .t{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bk-item .t small{display:block;font-weight:400;color:var(--muted)}
.bk-item .acts{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px}
.bk-item .acts button{padding:3px 9px;font-size:13px}
.bk-item.off{opacity:.55}
.bk-item.off .who{text-decoration:line-through}
.bk-warn{color:var(--warn);font-size:12px}
.pay{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:4px 14px 12px}
.pay h3{margin-top:10px}
.pay-st{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.pay-st.ok{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.pay-st.part{background:var(--bot);color:var(--text)}
.pay-list{display:flex;flex-direction:column;gap:4px;margin:6px 0;font-size:13px}
.pay-list div{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center}
.pay-list span:first-child{color:var(--muted);white-space:nowrap}
.pay-list b.neg{color:var(--warn)}
.pay-list button{padding:1px 7px;font-size:12px}
.pay-sum{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;margin:8px 0;font-size:14px}
.pay-sum .due{color:var(--accent)}
.pay-form{display:grid;grid-template-columns:110px auto minmax(0,1fr) auto;gap:6px}
.pay-form input,.pay-form select{font:inherit;font-size:14px;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0}
.cash-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.cash-tiles div{background:var(--bg);border-radius:10px;padding:8px 12px}
.cash-tiles b{display:block;font-size:18px}
.stock-low,.sub.stock-low{color:var(--accent)}
.intake{margin:4px 0 6px;border:1px solid var(--line);border-radius:12px;padding:2px 14px 12px}
.intake h3{margin-top:10px}
.intake-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.intake-sig{display:flex;align-items:center;gap:10px;margin-top:6px}
.intake-sig img{height:44px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:2px}
.intake-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px}
.intake-items input:not([type]){grid-column:1 / -1;margin-top:4px}
.sign-pad canvas{width:100%;height:200px;background:#fff;border:1px dashed var(--muted);border-radius:10px;touch-action:none;display:block;margin:8px 0 4px}
.sign-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sign-row input{flex:1;min-width:160px;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.tg{font-size:12px;white-space:nowrap;color:var(--ok)}
.tg.off{color:var(--muted)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.client-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.client-head h3{margin:0;font-size:18px;text-transform:none;letter-spacing:0;color:var(--text)}
.client-stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.client-stats div{background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px}
.client-stats b{display:block;font-size:16px}
.cars{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.car{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.car .sub{flex:1;min-width:160px}
.bc-form textarea{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-height:120px;resize:vertical}
.bc-list{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0 10px;font-size:13px}
.bc-list label{display:flex;gap:6px;align-items:center;padding:3px 0}
.send-sec{border-top:1px solid var(--line);padding:12px 0 4px}
.send-sec:first-child{border-top:0;padding-top:4px}
.send-sec h3{margin:0 0 6px}
.send-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.qr{background:#fff;border-radius:12px;padding:10px;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.qr svg{width:100%;height:100%}
.qr-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.qr-wrap .link{flex:1;min-width:180px;word-break:break-all;font-size:12px;color:var(--muted)}
.ok-line{color:var(--ok);font-weight:600}
.form-warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-top:10px}
button.danger-lite{color:var(--accent)}
.line-add button{font-size:13px;padding:5px 12px}
#orderBody td.acts button{padding:2px 7px;font-size:12px}
.ai-cost{font-size:12px;color:var(--muted);margin:-6px 0 12px}
.usage{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => Number(v).toLocaleString("uk-UA", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const dash = v => (v === null || v === undefined || v === "") ? "—" : esc(v);
let busy = false;
let STATUSES = ["чернетка", "прийнято", "в роботі", "готово", "видано", "скасовано"];
const usd = c => c > 0 && c < 0.01 ? "< $0,01" : "$" + Number(c || 0).toLocaleString("uk-UA",
  {minimumFractionDigits: 2, maximumFractionDigits: c < 1 ? 3 : 2});
const stClass = s => "st-" + Math.max(0, STATUSES.indexOf(s));

function md(text){
  // Мінімальна розмітка: абзаци, списки, **жирний**, `код`.
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let html = "", list = null;
  for (const raw of text.split("\n")){
    const line = raw.trim();
    const m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m){ if (!list){ list = []; } list.push(`<li>${inline(m[1])}</li>`); continue; }
    if (list){ html += `<ul>${list.join("")}</ul>`; list = null; }
    if (line) html += `<p>${inline(line)}</p>`;
  }
  if (list) html += `<ul>${list.join("")}</ul>`;
  return html;
}

function addMsg(role, text){
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = role === "assistant" ? md(text) : esc(text).replace(/\n/g, "<br>");
  $("#log").appendChild(div);
  $("#log").scrollTop = $("#log").scrollHeight;
  return div;
}

function greet(){
  addMsg("assistant", "Вітаю! Опишіть клієнта, автомобіль (VIN, пробіг) і скарги — я підберу роботи та запчастини й оформлю замовлення-наряд.");
}

// Номер останнього замовлення-наряду в браузері: після перезапуску сервера відкриваємо його знову.
function remember(number){
  try{ number ? localStorage.setItem("lastOrder", number) : localStorage.removeItem("lastOrder"); }catch(e){}
}
function remembered(){
  try{ return localStorage.getItem("lastOrder"); }catch(e){ return null; }
}

let ASSIGNEES = [], INTAKE_ITEMS = [];
let currentOrder = null, TELEGRAM = false, BACKUP_CHAT = false, PHOTO_KINDS = ["до", "після", "пошкодження", "інше"];

// ---------- Внутрішні коментарі (не друкуються) ----------
function authorName(){ try{ return localStorage.getItem("author") || ""; }catch(e){ return ""; } }
function setAuthorName(v){ try{ localStorage.setItem("author", v); }catch(e){} }

function renderComments(list){
  const box = $("#internalBox");
  if (!box || !currentOrder) return;
  currentOrder.comments = list;
  renderOrderBar(currentOrder);
  const typing = document.activeElement && document.activeElement.id === "cText" ? $("#cText").value : "";
  box.dataset.count = list.length;
  box.innerHTML = `<h3>💬 Внутрішні коментарі${list.length ? " · " + list.length : ""}</h3>
    <div class="sub desc-m" style="margin:-4px 0 10px">Лише для співробітників — у друковану форму не потрапляють.${TELEGRAM ? " Також з'являються в Telegram-групі, а відповіді там — тут." : ""}</div>
    <div class="comments">${list.map(c => `<div class="comment">
        <div class="meta"><b>${esc(c.author)}</b> · ${esc(c.at)} · ${c.source === "telegram" ? "📱 Telegram" : "🖥 сайт"}</div>
        <div>${esc(c.text).replace(/\n/g, "<br>")}</div>${c.voice ? `<audio controls preload="none" src="/voice/${encodeURIComponent(currentOrder.number)}/${esc(c.voice.file)}"></audio>

function signDialog(){
  if (!currentOrder) return;
  const o = currentOrder;
  $("#lineTitle").textContent = "Підпис клієнта";
  $("#lineBody").innerHTML = `<div class="sign-pad">
      <p class="sub">${esc(o.vehicle.model ? "Tesla " + o.vehicle.model : "Автомобіль")}${o.vehicle.plate ? " · " + esc(o.vehicle.plate) : ""} · замовлення-наряд № ${esc(o.number)}</p>
      <p>Із технічним станом автомобіля, переліком залишених речей і зауваженнями щодо пошкоджень ознайомлений(-а) і згоден(-на).</p>
      <canvas id="sigCanvas" aria-label="Поле для підпису"></canvas>
      <div class="sub">Підпишіться пальцем або мишею в полі вище.</div>
      <div class="sign-row"><input id="sigName" placeholder="ПІБ клієнта" value="${esc(o.customer.name)}" aria-label="ПІБ клієнта">
        <button type="button" id="sigClear">Очистити</button><button type="button" class="primary" id="sigSave">Зберегти підпис</button></div>
      <div class="form-err" id="lineErr" hidden></div></div>`;
  $("#lineDlg").showModal();
  const canvas = $("#sigCanvas"), ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.clientWidth * ratio; canvas.height = canvas.clientHeight * ratio;
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio); ctx.lineWidth = 2.4; ctx.lineCap = ctx.lineJoin = "round"; ctx.strokeStyle = "#111";
  let drawing = false, strokes = 0, last = null;
  const pos = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  canvas.onpointerdown = e => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); strokes++;
    ctx.beginPath(); ctx.arc(last[0], last[1], 1.1, 0, Math.PI * 2); ctx.fillStyle = "#111"; ctx.fill(); };
  canvas.onpointermove = e => { if (!drawing) return; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; };
  canvas.onpointerup = canvas.onpointercancel = () => { drawing = false; };
  $("#sigClear").onclick = () => { ctx.clearRect(0, 0, canvas.width, canvas.height); strokes = 0; };
  $("#sigSave").onclick = async () => {
    const err = msg => { $("#lineErr").hidden = false; $("#lineErr").textContent = msg; };
    if (!strokes) return err("Поле підпису порожнє");
    if (!$("#sigName").value.trim()) return err("Вкажіть ПІБ того, хто підписує");
    $("#sigSave").disabled = true;
    try{
      const r = await api("/api/order/intake/sign", {method: "POST", body: JSON.stringify({image: canvas.toDataURL("image/png"), signed_by: $("#sigName").value})});
      $("#lineDlg").close();
      renderOrder(r.order);
    }catch(e){ err(e.message); $("#sigSave").disabled = false; }
  };
}

async function api(path, opts = {}){
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, credentials: "same-origin", ...opts});
  const data = await r.json().catch(() => ({}));
  if (r.status === 401){ location.href = "/login"; throw new Error("Потрібно увійти"); }
  if (!r.ok) throw new Error(data.error || data.detail || `Помилка ${r.status}`);
  return data;
}

// Голосове введення: розпізнавання мовлення вбудоване в браузер (Web Speech API).
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;

// Голосове введення працює в чаті й у вікні «Запис»: ціль — поле, кнопка мікрофона й куди писати помилки.
const VOICE_CHAT = {input: "#input", mic: "#mic", error: msg => addMsg("error", msg)};
let voiceTarget = VOICE_CHAT;

function setListening(on, target = voiceTarget){
  const mic = $(target.mic), input = $(target.input);
  mic.classList.toggle("on", on);
  mic.setAttribute("aria-pressed", String(on));
  mic.title = on ? "Зупинити запис" : "Голосове введення";
  if (on){ input.dataset.placeholder = input.placeholder; input.placeholder = "Слухаю… говоріть"; }
  else if (input.dataset.placeholder){ input.placeholder = input.dataset.placeholder; }
}

function stopVoice(discard = false){
  if (!recognizer) return;
  if (discard) recognizer.onresult = null;  // текст уже отправлен — пізні результати не потрібні
  recognizer.stop();
}

function startVoice(target = VOICE_CHAT){
  voiceTarget = target;
  if (!Recognition){
    target.error("Цей браузер не підтримує голосове введення. Скористайтеся мікрофоном на клавіатурі телефона або відкрийте сторінку в Chrome чи Safari.");
    return;
  }
  const input = $(target.input);
  const base = input.value.trim() ? input.value.trim() + " " : "";
  const r = new Recognition();
  r.lang = "uk-UA";
  // Chrome на Android у безперервному режимі дублює фрази, тому там запис зупиняється після паузи.
  r.continuous = !/Android/i.test(navigator.userAgent);
  r.interimResults = true;
  r.onresult = e => {
    let text = "";
    for (const res of e.results) text += res[0].transcript;
    input.value = base + text.trim();
  };
  r.onerror = e => {
    const msg = {
      "not-allowed": "Немає доступу до мікрофона. Дозвольте його в налаштуваннях браузера для цього сайту.",
      "service-not-allowed": "Немає доступу до мікрофона. Дозвольте його в налаштуваннях браузера для цього сайту.",
      "audio-capture": "Мікрофон не знайдено.",
      "network": "Розпізнавання мовлення недоступне: немає з'єднання.",
    }[e.error];
    if (msg) target.error(msg);
  };
  r.onend = () => {
    setListening(false, target);
    if (recognizer === r){ recognizer = null; input.focus(); }  // могли вже ввімкнути мікрофон в іншому полі
  };
  try{ r.start(); }catch(err){ target.error("Не вдалося увімкнути мікрофон: " + err.message); return; }
  recognizer = r;
  setListening(true, target);
}

async function send(text){
  text = text.trim();
  if (!text || busy) return;
  if (voiceTarget === VOICE_CHAT) stopVoice(true);
  busy = true; $("#send").disabled = true;
  addMsg("user", text);
  $("#input").value = "";
  const typing = document.createElement("div");
  typing.className = "typing"; typing.textContent = "Помічник працює";
  $("#log").appendChild(typing); $("#log").scrollTop = $("#log").scrollHeight;
  try{
    const data = await api("/api/chat", {method: "POST", body: JSON.stringify({text})});
    typing.remove();
    if (data.reply) addMsg("assistant", data.reply);
    renderOrder(data.order);
  }catch(e){
    typing.remove();
    addMsg("error", e.message);
  }finally{
    busy = false; $("#send").disabled = false; $("#input").focus();
  }
}

let clientPoll = null;
async function sendToClientDialog(o){
  clearInterval(clientPoll);
  $("#lineTitle").textContent = `Надіслати клієнту · № ${o.number}`;
  $("#lineBody").innerHTML = `
    <div class="send-sec"><h3>PDF через «Поділитися»</h3>
      <div class="sub">Відкриється меню телефона: виберіть Telegram (чи Viber) і чат клієнта.</div>
      <div class="send-row"><button class="primary" id="sharePdf" disabled>📤 Поділитися PDF</button>
        <a class="sub" id="pdfLink" href="/pdf/${encodeURIComponent(o.number)}" target="_blank" rel="noopener">⬇ Відкрити PDF</a></div>
      <div class="sub" id="shareNote">Готую PDF…</div></div>
    ${TELEGRAM ? `<div class="send-sec"><h3>Через бота ${esc(document.title)}</h3><div id="botBox" class="sub">Завантаження…</div></div>` : ""}
    <div class="form-err" id="lineErr" hidden></div>`;
  $("#lineDlg").showModal();
  $("#lineDlg").addEventListener("close", () => clearInterval(clientPoll), {once: true});

  // PDF готуємо заздалегідь: iPhone дозволяє «Поділитися» лише одразу після натискання кнопки.
  let file = null;
  try{
    const r = await fetch(`/pdf/${encodeURIComponent(o.number)}`, {credentials: "same-origin"});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `Помилка ${r.status}`);
    file = new File([await r.blob()], `Замовлення-наряд ${o.number}.pdf`, {type: "application/pdf"});
    if (navigator.canShare && navigator.canShare({files: [file]})){
      $("#sharePdf").disabled = false;
      $("#shareNote").textContent = "";
    }else{
      $("#sharePdf").hidden = true;
      $("#shareNote").textContent = "Цей браузер не вміє «Поділитися» файлом — відкрийте PDF, збережіть і надішліть у Telegram вручну.";
    }
  }catch(e){ $("#shareNote").textContent = e.message; $("#sharePdf").hidden = true; }
  $("#sharePdf").onclick = async () => {
    try{ await navigator.share({files: [file], title: `Замовлення-наряд ${o.number}`}); }
    catch(e){ if (e.name !== "AbortError") $("#shareNote").textContent = e.message; }
  };
  if (TELEGRAM) loadBotBox(o);
}

    try{ await navigator.clipboard.writeText(d.link); $("#copyLink").textContent = "✓ Скопійовано"; }

  if ($("#shareLink")) $("#shareLink").onclick = () => navigator.share({text: `Ваш замовлення-наряд № ${o.number}: ${d.link}`}).catch(() => {});

async function shrinkPhoto(file){
  // Зменшуємо до 1600 px по довшій стороні: так швидше й дешевше, а текст лишається читабельним.
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error("Не вдалося відкрити фото"));
      i.src = url;
    });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.naturalWidth * k);
    canvas.height = Math.round(img.naturalHeight * k);
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.85);
  }finally{ URL.revokeObjectURL(url); }
}

  const typing = document.createElement("div");

    typing.className = "typing"; typing.textContent = "Розпізнаю фото";
    $("#log").appendChild(typing); $("#log").scrollTop = $("#log").scrollHeight;
    const r = await api("/api/photo", {method: "POST", body: JSON.stringify({image})});

  }

// ---------- Запис на сервіс (планувальник) ----------
let bkStart = null;
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoDate(d); };
const ddmm = iso => iso.slice(8, 10) + "." + iso.slice(5, 7);
const endTime = (t, m) => { const x = Number(t.slice(0, 2)) * 60 + Number(t.slice(3)) + m; return `${String(Math.floor(x / 60) % 24).padStart(2, "0")}:${String(x % 60).padStart(2, "0")}`; };

async function showBookings(){
  if (!$("#bookingsDlg").open){ $("#bookingsDlg").showModal(); bkStart = bkStart || isoDate(new Date()); }
  $("#bkRange").textContent = `${ddmm(bkStart)} — ${ddmm(addDays(bkStart, 6))}`;
  let data;
  try{ data = await api(`/api/bookings?start=${bkStart}&days=7`); }
  catch(e){ $("#bkDays").textContent = e.message; return; }
  const today = isoDate(new Date());
  const byId = {};
  data.days.forEach(d => d.items.forEach(b => { byId[b.id] = b; }));
  $("#bkDays").innerHTML = data.days.map(d => `<div class="bk-day ${d.date === today ? "today" : ""}">
    <h4>${esc(d.weekday)} ${ddmm(d.date)}${d.date === today ? " · сьогодні" : ""}</h4>
    ${d.items.length ? d.items.map(b => {
      const off = b.status === "скасовано" || b.status === "не приїхав";
      return `<div class="bk-item ${off ? "off" : ""}">
        <div class="t">${esc(b.time)}<small>до ${endTime(b.time, b.duration_min)}</small></div>
        <div><div class="who"><b>${esc(b.client_name)}</b>${b.phone ? ` <span class="sub">${esc(b.phone)}</span>` : ""}${b.car ? ` · ${esc(b.car)}` : ""}</div>
          ${b.work ? `<div>${esc(b.work)}</div>` : ""}${b.note ? `<div class="sub">📝 ${esc(b.note)}</div>` : ""}
          <div class="sub">${b.status !== "заплановано" ? `<span class="badge">${esc(b.status)}</span> ` : ""}${b.order_number ? `→ ${esc(b.order_number)} ` : ""}${b.created_by ? `записав(-ла) ${esc(b.created_by)}` : ""}</div>
          ${b.overlaps.length ? `<div class="bk-warn">⚠ Накладка: ${b.overlaps.map(id => byId[id] ? `${esc(byId[id].time)} ${esc(byId[id].client_name)}` : "").join(", ")}</div>` : ""}</div>
        ${b.status === "заплановано" ? `<div class="acts">
          <button data-bk-order="${esc(b.id)}" class="primary">🚗 Приїхав → замовлення</button>
          <button data-bk-edit="${esc(b.id)}">✎ Змінити</button>
          <button data-bk-status="${esc(b.id)}:не приїхав">Не приїхав</button>
          <button data-bk-status="${esc(b.id)}:скасовано">Скасувати</button></div>` : ""}
      </div>`; }).join("") : `<div class="sub">—</div>`}</div>`).join("");
  $("#bkDays").dataset.items = JSON.stringify(byId);
}

function bkLog(text, cls){
  const div = document.createElement("div");
  div.className = cls || "";
  if (cls) div.textContent = text; else div.innerHTML = md(text);
  $("#bkLog").appendChild(div);
  while ($("#bkLog").children.length > 6) $("#bkLog").firstChild.remove();
}

$("#bkAgentForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("#bkText").value.trim();
  if (!text) return;
  if (voiceTarget === VOICE_BOOKING) stopVoice(true);
  $("#bkSend").disabled = true; $("#bkSend").textContent = "…";
  bkLog(text, "me");
  try{
    const r = await api("/api/bookings/agent", {method: "POST", body: JSON.stringify({text, author: authorName()})});
    $("#bkText").value = "";
    bkLog(r.reply);
    showBookings();
  }catch(err){ bkLog(err.message, "err"); }
  $("#bkSend").disabled = false; $("#bkSend").textContent = "Записати";
};
$("#bkText").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); $("#bkAgentForm").requestSubmit(); }
});

      <label for="bDate">Дата</label><input id="bDate" type="date" value="${esc(b ? b.date : bkStart > today ? bkStart : today)}" required>
      <label for="bTime">Час</label><input id="bTime" type="time" value="${esc(b ? b.time : "10:00")}" step="300" required>

      <label for="bName">Клієнт</label><input id="bName" value="${esc(b ? b.client_name : "")}" required>
      <label for="bPhone">Телефон</label><input id="bPhone" type="tel" value="${esc(b ? b.phone : "")}" placeholder="+380…">
      <label for="bCar">Автомобіль</label><input id="bCar" value="${esc(b ? b.car : "")}" placeholder="Model Y, АА1234ВВ">
      <label for="bWork">Що зробити</label><input id="bWork" value="${esc(b ? b.work : "")}">
      <label for="bNote">Примітка</label><input id="bNote" value="${esc(b ? b.note : "")}">
      <span></span><div><div class="form-err" id="lineErr" hidden></div>
        <div class="form-actions"><button class="primary" type="submit">Зберегти</button><button type="button" id="lineCancel">Скасувати</button></div></div>
    </form>`;
  $("#lineDlg").showModal();
  $("#lineCancel").onclick = () => $("#lineDlg").close();
  $("#bkForm").onsubmit = async e => {
    e.preventDefault();
    const body = {date: $("#bDate").value, time: $("#bTime").value, duration_min: Number($("#bDur").value) || 60,
                  client_name: $("#bName").value, phone: $("#bPhone").value, car: $("#bCar").value,
                  work: $("#bWork").value, note: $("#bNote").value, author: authorName()};
    try{
      await api(b ? `/api/bookings/${b.id}` : "/api/bookings", {method: b ? "PUT" : "POST", body: JSON.stringify(body)});
      $("#lineDlg").close();
      showBookings();
    }catch(err){ $("#lineErr").hidden = false; $("#lineErr").textContent = err.message; }

const VOICE_BOOKING = {input: "#bkText", mic: "#bkMic", error: msg => bkLog(msg, "err")};
$("#bkMic").onclick = () => {
  if (recognizer){ const same = voiceTarget === VOICE_BOOKING; stopVoice(); if (same) return; }
  startVoice(VOICE_BOOKING);
};
$("#btnBookings").onclick = showBookings;
$("#closeBookings").onclick = () => $("#bookingsDlg").close();
$("#bookingsDlg").addEventListener("close", () => { if (voiceTarget === VOICE_BOOKING) stopVoice(); });
$("#bookingsDlg").addEventListener("click", async e => {
  const d = e.target.dataset;
  if (d.bkNav !== undefined){ bkStart = d.bkNav === "0" ? isoDate(new Date()) : addDays(bkStart, Number(d.bkNav)); return showBookings(); }
  if (d.bkNew !== undefined) return bookingForm(null);
  const items = JSON.parse($("#bkDays").dataset.items || "{}");
  if (d.bkEdit) return bookingForm(items[d.bkEdit]);
  if (d.bkStatus){
    const [id, status] = d.bkStatus.split(":");
    const b = items[id];
    if (!confirm(`${status === "скасовано" ? "Скасувати запис" : "Позначити «не приїхав»"}: ${b.time} ${b.client_name}?`)) return;
    try{ await api(`/api/bookings/${id}/status`, {method: "POST", body: JSON.stringify({status, author: authorName()})}); showBookings(); }
    catch(err){ alert(err.message); }
    return;
  }
  if (d.bkOrder){
    if (busy) return;
    try{
      const data = await api(`/api/bookings/${d.bkOrder}/order`, {method: "POST"});
      $("#bookingsDlg").close(); $("#log").innerHTML = "";
      addMsg("assistant", `Створено замовлення-наряд № ${data.order.number} за записом. Уточніть пробіг${data.order.vehicle.vin ? "" : " і VIN"} — тут або в панелі.`);
      renderOrder(data.order);
      document.querySelector('.tabs button[data-tab="order"]').click();
    }catch(err){ alert(err.message); }
  }
});

// ---------- База клієнтів і розсилка ----------
let clientsData = null, clientsQuery = "", clientsFilter = "";
const CLIENT_FILTERS = [["", "усі"], ["tg", "📲 у Telegram"], ["6", "не були 6+ міс."], ["12", "не були 12+ міс."]];
const BC_TEMPLATES = {
  "Нагадування про ТО": "Добрий день, {ім'я}! Нагадуємо, що для {авто} настав час планового обслуговування. Запишіться до {сервіс}: {адреса}.",
  "Сезонна заміна шин": "Добрий день, {ім'я}! Час сезонної заміни шин для {авто}. Чекаємо вас у {сервіс}: {адреса}.",
  "Довільне": ""};
const tgBadge = c => c.telegram ? (c.telegram.blocked ? `<span class="tg off" title="Клієнт заблокував бота">🚫 заблокував</span>`
  : `<span class="tg" title="Підключився до бота ${esc(c.telegram.at)}">📲 Telegram</span>`) : "";
const dateOnly = d => d ? esc(String(d).split(" ")[0]) : "—";

function clientMatches(c){
  if (clientsFilter === "tg" && !(c.telegram && !c.telegram.blocked)) return false;
  if ((clientsFilter === "6" || clientsFilter === "12") && !(c.months != null && c.months >= Number(clientsFilter))) return false;
  const words = clientsQuery.toLowerCase().split(/\s+/).filter(Boolean);
  const digits = clientsQuery.replace(/\D/g, "");
  const hay = `${c.name} ${c.email} ${c.cars.map(x => `${x.vin} ${x.plate || ""} ${x.model || ""}`).join(" ")}`.toLowerCase();
  if (digits.length >= 3 && /^[\d\s+()-]+$/.test(clientsQuery.trim())) return c.phone.replace(/\D/g, "").includes(digits);
  return words.every(w => hay.includes(w));
}

  $("#clientsTitle").textContent = "Розсилка в Telegram";
  $("#clientsBody").innerHTML = `

    <div class="bc-form">
      <div class="sub">Повідомлення отримають лише клієнти, які підключились до бота (натиснули «Старт»). Підстановки:

      <div class="filter-chips" id="bcTemplates" style="margin-top:8px">${Object.keys(BC_TEMPLATES).map(t => `<button data-tpl="${esc(t)}">${esc(t)}</button>`).join("")}</div>

      <div class="sub">Фільтр і пошук зі списку клієнтів: «${esc((CLIENT_FILTERS.find(f => f[0] === clientsFilter) || ["", "усі"])[1])}»${clientsQuery ? `, «${esc(clientsQuery)}»` : ""}.</div>
      ${recipients.length ? `<div class="bc-list">${recipients.map(c => `<label><input type="checkbox" data-bc-key="${esc(c.key)}" checked> ${dash(c.name)} <span class="sub">${esc(c.phone)} · ${c.cars.map(x => esc(x.model || "Tesla")).join(", ")} · ${dateOnly(c.last_visit)}</span></label>`).join("")}</div>`
        : `<div class="empty">Немає підключених до бота клієнтів за цим фільтром.</div>`}
      <div class="send-row"><button class="primary" id="bcSend" ${recipients.length ? "" : "disabled"}>📣 Надіслати</button><span id="bcRes"></span></div>
      ${clientsData.broadcasts.length ? `<h3>Попередні розсилки</h3><div class="tbl"><table><tr><th>Дата</th><th>Текст</th><th class="r">Надіслано</th></tr>
        ${clientsData.broadcasts.map(b => `<tr><td>${esc(b.at)}</td><td class="sub">${esc(b.text)}</td><td class="r">${b.sent}${b.failed ? ` <span class="sub">(не доставлено ${b.failed})</span>` : ""}</td></tr>`).join("")}</table></div>` : ""}
    </div>`;
  const count = () => {
    const n = document.querySelectorAll("[data-bc-key]:checked").length;
    $("#bcCount").textContent = n; $("#bcSend").textContent = `📣 Надіслати (${n})`;
    const first = recipients.find(c => document.querySelector(`[data-bc-key="${CSS.escape(c.key)}"]`).checked);
    const t = $("#bcText").value;
    $("#bcPreview").textContent = first && t ? "Приклад: " + t.replaceAll("{ім'я}", first.name || "").replaceAll("{авто}",
      first.cars[0] ? `Tesla ${first.cars[0].model || ""}${first.cars[0].plate ? ` (${first.cars[0].plate})` : ""}`.replace(/\s+/g, " ") : "ваш автомобіль")
      .replaceAll("{сервіс}", document.title).replaceAll("{адреса}", catalogAddress()) : "";
  };
  $("#bcText").oninput = count;
  $("#clientsBody").onchange = e => { if (e.target.dataset.bcKey !== undefined) count(); };
  $("#bcTemplates").onclick = e => { if (e.target.dataset.tpl !== undefined){ $("#bcText").value = BC_TEMPLATES[e.target.dataset.tpl]; $("#bcText").focus(); count(); } };
  if (recipients.length) count();
  $("#bcSend").onclick = async () => {
    const keys = [...document.querySelectorAll("[data-bc-key]:checked")].map(x => x.dataset.bcKey);
    const text = $("#bcText").value.trim();
    if (!text){ $("#bcText").focus(); return; }

    $("#bcSend").disabled = true; $("#bcRes").textContent = "Надсилаю…";
    try{

      $("#bcRes").innerHTML = `<span class="ok-line">✓ Надіслано: ${r.sent}</span>${r.failed ? ` · не доставлено: ${r.failed} (клієнт міг заблокувати бота)` : ""}`;
    }catch(e){ $("#bcRes").textContent = e.message; $("#bcSend").disabled = false; }
  };
}

  </div>`;
}

      ${d.alerts.map(a => `<button class="attn-row" ${a.number ? `data-home-open="${esc(a.number)}"` : a.kind === "stock" ? 'data-home-act="stock"' : 'data-home-act="booking"'}>

      ${d.alerts.length > 3 ? `<button class="attn-more" data-attn-more>Показати всі (${d.alerts.length})</button>` : ""}</section>` : ""}
    <section id="home-board"><h3>Замовлення в роботі</h3>
      <div class="stage-tabs">${STAGES.map(([st, title], i) => `<button data-home-stage="${i}" class="${i === stageIndex ? "on" : ""}">${title.split(" ").slice(1).join(" ").replace(" до видачі", "")} <span class="badge">${d.board[st].filter(mine).length}</span></button>`).join("")}</div>

async function openFromHome(number){
  try{
    if (!currentOrder || currentOrder.number !== number){
      const data = await api(`/api/orders/${encodeURIComponent(number)}/open`, {method: "POST"});
      $("#log").innerHTML = "";
      addMsg("assistant", `Відкрито замовлення-наряд № ${number}. Що потрібно змінити?`);
      renderOrder(data.order);
    }
    document.querySelector('.tabs button[data-tab="order"]').click();
  }catch(err){ alert(err.message); }
}

$("#homeBody").addEventListener("click", async e => {
  if (e.target.dataset.attnMore !== undefined){ $("#attn").classList.remove("folded"); return; }
  const el = e.target.closest("[data-home-next],[data-home-arrive],[data-home-act],[data-home-jump],[data-home-stage],[data-home-open]");
  if (!el) return;
  const d = el.dataset;
  if (d.homeNext){
    e.stopPropagation();
    const t = Object.values(homeData.board).flat().find(x => x.number === d.homeNext);
    if (d.status === "видано" && t && Number(t.balance) > 0 &&
        !confirm(`Клієнт ще не сплатив ${num(t.balance)} $. Видати автомобіль у борг?`)) return;
    el.disabled = true;
    try{ await api(`/api/orders/${encodeURIComponent(d.homeNext)}/status`, {method: "POST", body: JSON.stringify({status: d.status, by: authorName()})}); }
    catch(err){ alert(err.message); }
    return loadHome();
  }
  if (d.homeArrive){
    try{
      const data = await api(`/api/bookings/${d.homeArrive}/order`, {method: "POST"});
      $("#log").innerHTML = "";
      addMsg("assistant", `Створено замовлення-наряд № ${data.order.number} за записом. Уточніть пробіг${data.order.vehicle.vin ? "" : " і VIN"} — тут або в панелі.`);
      renderOrder(data.order);
      document.querySelector('.tabs button[data-tab="order"]').click();
    }catch(err){ alert(err.message); }
    return;
  }
  if (d.homeStage !== undefined){ homeStage = Number(d.homeStage); renderHome(); return; }
  if (d.homeJump){
    const m = d.homeJump.match(/^stage-(\d)$/);
    if (m && matchMedia("(max-width: 900px)").matches){ homeStage = Number(m[1]); renderHome(); }
    document.getElementById(m && matchMedia("(max-width: 900px)").matches ? "home-board" : d.homeJump)?.scrollIntoView({behavior: "smooth", block: "start"});
    return;
  }
  if (d.homeOpen) return openFromHome(d.homeOpen);
  const act = d.homeAct;
  if (act === "new"){ await newManualOrderFromHome(); return; }
  if (act === "work") return document.querySelector('.tabs button[data-tab="chat"]').click();
  if (act === "booking") return showBookings();
  if (act === "find") return showOrders();
  if (act === "cash") return showCash("cash");
  if (act === "debts") return showCash("debts");
  if (act === "stock"){ $("#catalogDlg").showModal(); try{ setCatalog(await api("/api/catalog")); showCatalog("stock"); }catch(err){ $("#catalogList").textContent = err.message; } }
});

function toggleMenu(open){
  const panel = $("#menuPanel");
  open = open ?? panel.hidden;
  panel.hidden = !open;
  $("#btnMenu").setAttribute("aria-expanded", String(open));
  $("#menuLogout").hidden = $("#btnLogout").hidden;
  if (open) panel.querySelector("button").focus();
}
$("#btnMenu").onclick = e => { e.stopPropagation(); toggleMenu(); };
$("#menuPanel").onclick = e => {
  const target = e.target.closest("[data-proxy]");
  if (!target) return;
  toggleMenu(false);
  $(target.dataset.proxy).click();
};
document.addEventListener("click", e => { if (!$("#menuPanel").hidden && !e.target.closest("#menuPanel")) toggleMenu(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#menuPanel").hidden) toggleMenu(false); });

      $("#clientsDlg").close(); $("#log").innerHTML = "";

let stockData = null, stockQuery = "", stockLowOnly = false;
async function loadStock(flash = ""){
  $("#catalogList").innerHTML = `${flash}<div class="toolbar">
      <input id="stockQuery" type="search" placeholder="Пошук запчастини або артикулу" value="${esc(stockQuery)}">
      <button data-download="/api/stock/to-order.xlsx">⬇ Що замовити (Excel)</button></div>
    <div class="filter-chips"><button data-stock-filter="0" class="${stockLowOnly ? "" : "on"}">усі</button><button data-stock-filter="1" class="${stockLowOnly ? "on" : ""}">⚠ треба замовити</button></div>
    <div class="sub" style="margin:6px 0">Запчастини з довідника списуються автоматично, коли замовлення-наряд отримує статус «видано».
      «Резерв» — уже вписані в замовлення, які ще не видано. Мінімум 0 — без нагадувань.</div>
    <div id="stockTable">Завантаження…</div>`;
  $("#stockQuery").oninput = e => { stockQuery = e.target.value; renderStockTable(); };
  try{ stockData = await api("/api/stock"); renderStockTable(); }
  catch(e){ $("#stockTable").textContent = e.message; }
}
function renderStockTable(){
  if (!stockData || !$("#stockTable")) return;
  const q = stockQuery.trim().toLowerCase();
  const items = stockData.items.filter(i => (!stockLowOnly || i.low || i.free < 0) && (!q || `${i.part_no} ${i.name}`.toLowerCase().includes(q)));
  const n = v => String(v).replace(".", ",");
  $("#stockTable").innerHTML = items.length ? `<div class="tbl"><table>
    <tr><th>Запчастина</th><th class="r">Залишок</th><th class="r hide-m">Резерв</th><th class="r hide-m">Мін.</th><th></th></tr>
    ${items.map(i => `<tr><td>${esc(i.name)}<div class="sub">${esc(i.part_no)}${i.reserved ? `<span class="show-m"> · резерв ${n(i.reserved)}</span>` : ""}</div></td>
      <td class="r"><b class="${i.low || i.free < 0 ? "stock-low" : ""}">${n(i.qty)}</b> ${esc(i.unit)}${i.free < 0 ? `<div class="sub stock-low">бракує ${n(-i.free)}</div>` : i.low ? `<div class="sub stock-low">замовити</div>` : ""}</td>
      <td class="r hide-m">${i.reserved ? n(i.reserved) : "—"}</td><td class="r hide-m">${i.min ? n(i.min) : "—"}</td>
      <td class="r acts"><button data-stock-in="${esc(i.part_no)}" title="Прихід">＋</button> <button data-stock-adj="${esc(i.part_no)}" title="Інвентаризація, мінімум, історія">⚖</button></td></tr>`).join("")}
    </table></div>` : `<div class="empty">${stockLowOnly ? "Усього вистачає — замовляти нічого." : "Нічого не знайдено."}</div>`;
}
async function stockDialog(partNo, mode){
  const i = stockData.items.find(x => x.part_no === partNo);
  if (!i) return;
  $("#lineTitle").textContent = `${mode === "in" ? "Прихід" : "Склад"}: ${i.name}`;
  $("#lineBody").innerHTML = `<form class="form" id="stockForm" autocomplete="off">
      <label>Залишок</label><div><b>${String(i.qty).replace(".", ",")} ${esc(i.unit)}</b>${i.reserved ? ` · у резерві ${String(i.reserved).replace(".", ",")}` : ""}</div>
      ${mode === "in" ? `<label for="sQty">Надійшло, ${esc(i.unit)}</label><input id="sQty" inputmode="decimal" required>
        <label for="sNote">Постачальник / примітка</label><input id="sNote" placeholder="напр., накладна № 123">`
      : `<label for="sQty">Фактично на складі</label><div><input id="sQty" inputmode="decimal" value="${String(i.qty).replace(".", ",")}">
          <div class="hint">Після перерахунку: різниця запишеться як «інвентаризація».</div></div>
        <label for="sMin">Мінімальний залишок</label><div><input id="sMin" inputmode="decimal" value="${String(i.min).replace(".", ",")}">
          <div class="hint">Коли залишиться стільки чи менше — бот напише в групу «закінчується».</div></div>
        <label for="sNote">Примітка</label><input id="sNote">`}
      <span></span><div><div class="form-err" id="lineErr" hidden></div>
        <div class="form-actions"><button class="primary" type="submit">Зберегти</button><button type="button" id="lineCancel">Скасувати</button></div></div>
    </form>
    ${mode === "in" ? "" : `<h3>Рух за останній час</h3><div id="stockMoves" class="sub">Завантаження…</div>`}`;
  $("#lineDlg").showModal();
  $("#lineCancel").onclick = () => $("#lineDlg").close();

    api(`/api/stock/${encodeURIComponent(partNo)}/moves`).then(rows => {
      $("#stockMoves").innerHTML = rows.length ? `<div class="tbl"><table><tr><th>Дата</th><th>Операція</th><th class="r">К-сть</th><th class="r">Залишок</th></tr>
        ${rows.slice(0, 50).map(r => `<tr><td>${esc(r.at)}</td><td>${esc(r.kind)}${r.order ? " · " + esc(r.order) : ""}${r.by ? " · " + esc(r.by) : ""}${r.note ? `<div class="sub">${esc(r.note)}</div>` : ""}</td>
          <td class="r">${r.qty > 0 ? "+" : ""}${String(r.qty).replace(".", ",")}</td><td class="r">${String(r.after).replace(".", ",")}</td></tr>`).join("")}</table></div>` : "Руху ще не було.";
    }).catch(e => { $("#stockMoves").textContent = e.message; });

  $("#stockForm").onsubmit = async e => {
    e.preventDefault();
    const body = {qty: $("#sQty").value, note: $("#sNote").value, by: authorName()};
    const url = `/api/stock/${encodeURIComponent(partNo)}`;
    try{
      if (mode === "in") await api(url + "/receive", {method: "POST", body: JSON.stringify(body)});
      else{
        if (String($("#sMin").value).replace(",", ".") !== String(i.min)) await api(url + "/min", {method: "PUT", body: JSON.stringify({qty: $("#sMin").value})});
        if (String(body.qty).replace(",", ".") !== String(i.qty)) await api(url + "/adjust", {method: "POST", body: JSON.stringify(body)});
      }
      $("#lineDlg").close();
      catFlash = mode === "in" ? `Прихід записано: ${i.name}` : `Збережено: ${i.name}`;
      showCatalog("stock");
    }catch(err){ $("#lineErr").hidden = false; $("#lineErr").textContent = err.message; }
  };
}

function renderOpsTable(){
  const cur = esc(catalogData.currency), words = catQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const ops = catalogData.operations.filter(o => (!catCategory || o.category === catCategory) &&
    words.every(w => `${o.code} ${o.name} ${o.category} ${o.parts.map(p => p.name).join(" ")}`.toLowerCase().includes(w)));
  if (!ops.length){ $("#opsTable").innerHTML = `<div class="empty">Нічого не знайдено.</div>`; return; }
  let html = `<div class="tbl"><table><tr><th>Робота</th><th class="hide-m">Моделі</th><th class="r">Ціна роботи</th><th class="r hide-m">Запчастини</th><th></th></tr>`;
  let last = null;
  for (const o of [...ops].sort((a, b) => catalogData.categories.indexOf(a.category) - catalogData.categories.indexOf(b.category))){
    if (o.category !== last){ html += `<tr class="cat-row"><td colspan="5">${esc(o.category)}</td></tr>`; last = o.category; }
    html += `<tr><td>${esc(o.name)}<div class="sub">${esc(o.code)}${o.interval ? " · " + esc(o.interval) : ""}${o.parts.length ? " · " + o.parts.map(p => esc(p.name)).join(", ") : ""}<span class="show-m"> · ${esc(o.models)}</span></div></td>
      <td class="hide-m">${esc(o.models)}</td>
      <td class="r">${num(o.price)} ${cur}${o.parts.length ? `<div class="sub show-m">+ запч. ${num(o.parts_price)}</div>` : ""}</td><td class="r hide-m">${o.parts.length ? num(o.parts_price) + " " + cur : "—"}</td>
      <td class="r acts"><button data-edit-op="${esc(o.code)}" title="Редагувати">✎</button> <button data-add="${esc(o.code)}" title="Додати до замовлення-наряду">＋</button></td></tr>`;
  }
  $("#opsTable").innerHTML = html + "</table></div>";
}

function renderPartsTable(){
  const cur = esc(catalogData.currency), q = partQuery.trim().toLowerCase();
  const parts = catalogData.parts.filter(p => !q || `${p.part_no} ${p.name}`.toLowerCase().includes(q));
  $("#partsTable").innerHTML = parts.length ? `<div class="tbl"><table>
    <tr><th>Запчастина</th><th class="r">Ціна</th><th class="hide-m">Од.</th><th class="r hide-m">У роботах</th><th></th></tr>
    ${parts.map(p => `<tr><td>${esc(p.name)}<div class="sub">${esc(p.part_no)}<span class="show-m"> · ${esc(p.unit)}</span></div></td>
      <td class="r">${num(p.price)} ${cur}</td><td class="hide-m">${esc(p.unit)}</td><td class="r hide-m">${p.used || "—"}</td>
      <td class="r"><button data-edit-part="${esc(p.part_no)}" title="Редагувати">✎</button></td></tr>`).join("")}

function formError(msg){
  const box = $("#formErr");
  box.hidden = !msg; box.textContent = msg || "";
  if (msg) box.scrollIntoView({block: "nearest"});
}

async function saveCatalog(method, url, body, flash, view){
  try{
    setCatalog(await api(url, {method, body: body ? JSON.stringify(body) : undefined}));
    catFlash = flash;
    showCatalog(view);
    return true;
  }catch(e){ formError(e.message); return false; }
}

function opForm(code){
  const o = code ? catalogData.operations.find(x => x.code === code) : null;
  const models = o ? o.model_codes : ["*"];
  let parts = o ? o.parts.map(p => p.part_no) : [];
  const partName = no => (catalogData.parts.find(p => p.part_no === no) || {name: no}).name;
  $("#catalogList").innerHTML = `<h3>${o ? "Редагування роботи" : "Нова робота"}</h3>
    <form class="form" id="opForm" autocomplete="off">
      <label for="fCode">Код</label>
      <div><input id="fCode" value="${esc(o ? o.code : "")}" ${o ? "disabled" : ""} placeholder="напр. BRK-PAD-F">
        ${o ? "" : `<div class="hint">Латинські літери, цифри, дефіс. Потім змінити не можна.</div>`}</div>
      <label for="fName">Назва</label><input id="fName" value="${esc(o ? o.name : "")}">
      <label for="fCat">Розділ</label><input id="fCat" list="catCategories" value="${esc(o ? o.category : catCategory)}" placeholder="оберіть або введіть новий">
      <label for="fPrice">Ціна роботи, ${esc(catalogData.currency)}</label><input id="fPrice" inputmode="decimal" value="${o ? fmtNum(o.price) : ""}" placeholder="напр. 80">
      <label>Моделі</label>
      <div class="checks" id="fModels">
        <label><input type="checkbox" value="*" ${models.includes("*") ? "checked" : ""}> усі</label>
        ${catalogData.models.map(m => `<label><input type="checkbox" value="${m.code}" ${models.includes(m.code) ? "checked" : ""}> ${esc(m.name)}</label>`).join("")}
      </div>
      <label>Запчастини</label>
      <div><div class="chips" id="fParts"></div>
        <div class="row"><select id="fPartSel"><option value="">— додати запчастину —</option>
          ${catalogData.parts.map(p => `<option value="${esc(p.part_no)}">${esc(p.name)} (${esc(p.part_no)})</option>`).join("")}</select></div></div>
      <label for="fInterval">Інтервал ТО</label><input id="fInterval" value="${esc(o ? o.interval : "")}" placeholder="напр. кожні 2 роки (необов'язково)">
      <span></span>
      <div><div class="form-err" id="formErr" hidden></div>
        <div class="form-actions"><button class="primary" type="submit">Зберегти</button><button type="button" data-cancel>Скасувати</button>
        ${o ? `<button type="button" class="danger" data-delete>Видалити</button>` : ""}</div></div>
    </form>`;
  const drawParts = () => $("#fParts").innerHTML = parts.length
    ? parts.map(no => `<span class="chip">${esc(partName(no))}<button type="button" data-rm="${esc(no)}" title="Прибрати">✕</button></span>`).join("")
    : `<span class="sub">без запчастин</span>`;
  drawParts();
  const syncModels = () => {
    const all = $('#fModels input[value="*"]').checked;
    document.querySelectorAll('#fModels input:not([value="*"])').forEach(c => c.disabled = all);
  };
  syncModels();
  $("#fModels").onchange = syncModels;
  $("#fPartSel").onchange = e => { const v = e.target.value; if (v && !parts.includes(v)) parts.push(v); e.target.value = ""; drawParts(); };
  $("#fParts").onclick = e => { const no = e.target.dataset.rm; if (no){ parts = parts.filter(x => x !== no); drawParts(); } };
  $("#opForm").onsubmit = e => {
    e.preventDefault();
    const all = $('#fModels input[value="*"]').checked;
    const body = {
      code: $("#fCode").value, name: $("#fName").value, category: $("#fCat").value, price: $("#fPrice").value,
      models: all ? ["*"] : [...document.querySelectorAll('#fModels input:checked')].map(c => c.value),
      parts, interval: $("#fInterval").value,
    };
    if (o) saveCatalog("PUT", `/api/catalog/operations/${encodeURIComponent(o.code)}`, body, `Роботу «${body.name}» збережено`, "ops");
    else saveCatalog("POST", "/api/catalog/operations", body, `Роботу «${body.name}» додано`, "ops");
  };
  $("#opForm [data-cancel]").onclick = () => showCatalog("ops");
  if (o) $("#opForm [data-delete]").onclick = () => {
    if (confirm(`Видалити роботу «${o.name}» з довідника?`))
      saveCatalog("DELETE", `/api/catalog/operations/${encodeURIComponent(o.code)}`, null, `Роботу «${o.name}» видалено`, "ops");
  };
  $("#fName").focus();
}

async function importExcel(file, apply){
  const box = $("#xlsxResult");
  box.innerHTML = `<div class="sub">${apply ? "Застосовую…" : "Перевіряю файл…"}</div>`;
  let r;
  try{
    const resp = await fetch(`/api/catalog/import${apply ? "?apply=true" : ""}`, {method: "POST", body: file, credentials: "same-origin",
                                                                              headers: {"Content-Type": "application/octet-stream"}});
    r = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(r.error || `Помилка ${resp.status}`);
  }catch(err){ box.innerHTML = `<div class="form-err">${esc(err.message)}</div>`; return; }
  if (apply){
    if (r.catalog) setCatalog(r.catalog);
    catFlash = `Прайс оновлено: робіт ${r.operations.length}, запчастин ${r.parts.length}`;
    showCatalog("settings");
    return;
  }
  const row = x => `<div>${x.action === "new" ? "＋ нова" : "✎ змінено"} · <b>${esc(x.code)}</b> ${esc(x.name)} · ${num(x.price)} $${x.changes.length ? ` <span class="sub">(${x.changes.map(esc).join(", ")})</span>` : ""}</div>`;
  const total = r.operations.length + r.parts.length;
  box.innerHTML = `
    ${total ? `<div class="import-list">${r.operations.length ? `<b>Роботи: ${r.operations.length}</b>${r.operations.map(row).join("")}` : ""}
      ${r.parts.length ? `<b>Запчастини: ${r.parts.length}</b>${r.parts.map(row).join("")}` : ""}</div>` : `<div class="sub">Змін немає — прайс у файлі збігається з довідником.</div>`}
    ${r.errors.length ? `<div class="form-err">Рядки з помилками (не буде застосовано):<div class="import-list">${r.errors.map(x => `<div>«${esc(x.sheet)}», рядок ${x.row}: ${esc(x.message)}</div>`).join("")}</div></div>` : ""}
    ${total ? `<div class="send-row"><button type="button" class="primary" id="xlsxApply">Застосувати зміни (${total})</button><button type="button" id="xlsxCancel">Скасувати</button></div>` : ""}`;
  if (total){
    $("#xlsxApply").onclick = () => importExcel(file, true);
    $("#xlsxCancel").onclick = () => { box.innerHTML = ""; };
  }
}

async function loadUsage(){
  try{
    const u = await api("/api/usage");
    const tile = (label, v) => `<div class="usage-tile"><b>${usd(v.cost_usd)}</b><span>${label} · запитів: ${v.requests}</span></div>`;
    const max = Math.max(...u.by_day.map(d => d.cost_usd), 0.0001);
    $("#usageBox").innerHTML = `<h3>Витрати на Claude</h3>
      <div class="usage-grid">${tile("сьогодні", u.today)}${tile("цей місяць", u.month)}${tile("усього", u.all)}
        <div class="usage-tile"><b>${usd(u.avg_per_order)}</b><span>у середньому на замовлення-наряд (${u.orders})</span></div></div>
      <div class="sub">По днях за 2 тижні</div>
      <div class="bars">${u.by_day.map(d => `<div title="${esc(d.day)}: ${usd(d.cost_usd)}, запитів: ${d.requests}">
        <i style="height:${Math.round(d.cost_usd / max * 100)}%"></i><small>${esc(d.day.slice(8))}</small></div>`).join("")}</div>
      <div class="hint">Оцінка за тарифами моделі й фактичними токенами з відповідей API. Точна сума — у console.anthropic.com → Usage.</div>`;
  }catch(e){ $("#usageBox").innerHTML = `<h3>Витрати на Claude</h3><div class="sub">${esc(e.message)}</div>`; }
}

$("#btnCatalog").onclick = async () => {
  $("#catalogDlg").showModal();
  try{
    setCatalog(await api("/api/catalog"));  // щоразу свіжі дані: довідник могли змінити інші
    showCatalog("ops");
  }catch(e){ $("#catalogList").textContent = e.message; }
};
$("#catTabs").onclick = e => { const v = e.target.dataset.view; if (v && catalogData) showCatalog(v); };
$("#closeCatalog").onclick = () => $("#catalogDlg").close();
$("#catalogList").addEventListener("click", e => {
  const d = e.target.dataset;
  if (d.download) return void (location.href = d.download);
  if (d.newOp !== undefined) return opForm(null);
  if (d.editOp) return opForm(d.editOp);
  if (d.newPart !== undefined) return partForm(null);
  if (d.editPart) return partForm(d.editPart);
  if (d.stockFilter !== undefined){ stockLowOnly = d.stockFilter === "1"; document.querySelectorAll("[data-stock-filter]").forEach(b => b.classList.toggle("on", b === e.target)); return renderStockTable(); }
  if (d.stockIn) return stockDialog(d.stockIn, "in");
  if (d.stockAdj) return stockDialog(d.stockAdj, "adj");
  if (!d.add) return;
  const op = catalogData.operations.find(o => o.code === d.add);
  $("#catalogDlg").close();
  document.querySelector('.tabs button[data-tab="chat"]').click();
  send(`Додай роботу ${op.code} — ${op.name}`);
});
$("#btnNew").onclick = async () => {
  if (busy) return;
  await api("/api/reset", {method: "POST"});
  remember(null);
  $("#log").innerHTML = ""; greet(); renderOrder(null);
  document.querySelector('.tabs button[data-tab="chat"]').click();
};
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
  const home = b.dataset.tab === "home";
  const wasHome = document.body.classList.contains("home-mode");
  document.body.classList.toggle("home-mode", home);
  $("#btnHome").classList.toggle("on", home);
  if (home){ loadHome(); return; }
  document.querySelectorAll("main > .card").forEach(c => c.classList.toggle("show", c.id === b.dataset.tab));
  // Повертаємось із головної — статус замовлення могли змінити там.
  if (wasHome && currentOrder) api("/api/state").then(st => { if (st.order) renderOrder(st.order); }).catch(() => {});
});

(async () => {
  try{
    const s = await api("/api/state");
    if (s.auth) $("#btnLogout").hidden = false;
    if (s.statuses) STATUSES = s.statuses;
    TELEGRAM = !!s.telegram;
    BACKUP_CHAT = !!s.backup_chat;
    ASSIGNEES = s.assignees || [];
    INTAKE_ITEMS = s.intake_items || [];
    if (s.photo_kinds) PHOTO_KINDS = s.photo_kinds;
    if (s.service) SERVICE_ADDRESS = s.service.address || "";
    if (s.service && s.service.name){ $("#brand").textContent = s.service.name; document.title = s.service.name; }
    if (s.short_name) $("#appTitle").content = s.short_name;  // підпис під іконкою на головному екрані iPhone
    if (s.history.length) s.history.forEach(m => addMsg(m.role, m.text));
    const last = remembered();
    if (!s.order && last){
      // Сервер перезапускався і забув розмову — відкриваємо автоматично збережену чернетку.
      try{
        const data = await api(`/api/orders/${encodeURIComponent(last)}/open`, {method: "POST"});
        addMsg("assistant", `Відновлено замовлення-наряд № ${last}. Попередню розмову не збережено — продовжуйте з того місця, де зупинилися.`);
        renderOrder(data.order);
        return;
      }catch(e){ remember(null); }
    }
    if (!s.history.length) greet();
    renderOrder(s.order);
  }catch(e){ greet(); renderOrder(null); addMsg("error", e.message); }
  finally{ document.querySelector('.tabs button[data-tab="home"]').click(); }  // стартова сторінка — головна
})();
