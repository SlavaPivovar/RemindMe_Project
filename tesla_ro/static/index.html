<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DK-TeslaService</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --text:#16181d; --muted:#6b7280; --line:#e3e5e9;
  --accent:#d32f2f; --accent-ink:#fff; --user:#1f2937; --user-ink:#fff; --bot:#f0f1f4;
  --warn-bg:#fff4e5; --warn:#9a5b00; --ok:#1b7f3b; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --panel:#171a20; --text:#e8eaed; --muted:#9aa1ad; --line:#2a2f38;
    --accent:#ef5350; --accent-ink:#fff; --user:#e8eaed; --user-ink:#111; --bot:#20242c;
    --warn-bg:#3a2a10; --warn:#f3b664; --ok:#5fd38a; --shadow:none;
  }
  :root:not([data-theme="light"]) .st-1{color:#93b4ff} :root:not([data-theme="light"]) .st-2{color:#f3b664}
  :root:not([data-theme="light"]) .st-3{color:#5fd38a} :root:not([data-theme="light"]) .st-4{color:#cbd5e1}
  :root:not([data-theme="light"]) .st-5{color:#f87171}
}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#171a20; --text:#e8eaed; --muted:#9aa1ad; --line:#2a2f38;
  --accent:#ef5350; --accent-ink:#fff; --user:#e8eaed; --user-ink:#111; --bot:#20242c;
  --warn-bg:#3a2a10; --warn:#f3b664; --ok:#5fd38a; --shadow:none;
}
:root[data-theme="dark"] .st-1{color:#93b4ff} :root[data-theme="dark"] .st-2{color:#f3b664}
:root[data-theme="dark"] .st-3{color:#5fd38a} :root[data-theme="dark"] .st-4{color:#cbd5e1}
:root[data-theme="dark"] .st-5{color:#f87171}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:7px 12px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 span:not(#brand){color:var(--muted);font-weight:400}
.tabs{display:none;gap:4px;padding:8px 16px 0}
.tabs button{flex:1}
.tabs button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(340px,5fr) 7fr;gap:16px;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-height:0;display:flex;flex-direction:column}
#chat .log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 12px;border-radius:12px;white-space:normal;overflow-wrap:anywhere}
.msg.user{align-self:flex-end;background:var(--user);color:var(--user-ink);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.msg.error{align-self:center;background:var(--warn-bg);color:var(--warn);font-size:13px}
.msg p{margin:0 0 6px}.msg p:last-child{margin:0}.msg ul{margin:4px 0 6px;padding-left:20px}
.typing{align-self:flex-start;color:var(--muted);font-size:13px}
.typing::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.hints{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.hints button{font-size:12px;padding:4px 10px;border-radius:999px;color:var(--muted)}
form.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
form.composer .mic{display:flex;align-items:center;justify-content:center;width:44px;padding:0;flex:none}
form.composer .mic svg{width:20px;height:20px}
form.composer .mic.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(211,47,47,.45)}50%{box-shadow:0 0 0 6px rgba(211,47,47,0)}}
form.composer textarea{flex:1;min-width:0;resize:none;font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);max-height:160px}
#order{overflow:auto}
#order .body{padding:16px 20px}
.empty{color:var(--muted);text-align:center;margin:auto;padding:40px 20px}
.ohead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;margin-bottom:12px}
.ohead h2{margin:0;font-size:18px}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bot);color:var(--muted)}
.ohead .actions{margin-left:auto;display:flex;gap:6px}
.missing{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.done{color:var(--ok);font-size:13px;margin-bottom:14px}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.info dl{margin:0;display:grid;align-content:start;grid-template-columns:auto 1fr;gap:3px 10px}
.info dt{color:var(--muted)}.info dd{margin:0;overflow-wrap:anywhere}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.r{text-align:right;white-space:nowrap}
ul.plain{margin:0;padding-left:18px}
.totals{margin:14px 0 0 auto;width:max-content;min-width:260px}
.totals div{display:flex;justify-content:space-between;gap:24px;padding:3px 0}
.totals .grand{font-size:16px;font-weight:700;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:0;width:min(760px,calc(100vw - 32px));max-height:80vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .dh{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
dialog .dh h2{margin:0;font-size:16px;flex:1}
dialog .db{padding:8px 16px 16px;overflow:auto;max-height:calc(80vh - 60px)}
dialog td button{padding:3px 8px;font-size:12px}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
.filters input,.filters select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.filters input{flex:1;min-width:160px}
.cat-row td{background:var(--bot);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.sub{color:var(--muted);font-size:12px}
.show-m{display:none}
.seg{display:flex;gap:4px;padding:10px 0 2px}
.seg button{flex:1}
.seg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;align-items:center}
.toolbar input,.toolbar select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.toolbar input{flex:1;min-width:150px}
.acts{white-space:nowrap}
.form{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 12px;align-items:start;padding:12px 0}
.form label{color:var(--muted);padding-top:8px}
.form input[type=text],.form input[type=tel],.form input[type=email],.form input:not([type]),.form select{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.form input:disabled{opacity:.6}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:7px}
.checks label{color:var(--text);padding:0;display:flex;gap:5px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bot);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.chip button{border:0;background:none;padding:0 6px;color:var(--muted)}
.row{display:flex;gap:6px}.row select{flex:1;min-width:0}
.form-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:6px}
.form-actions .danger{margin-left:auto;color:var(--accent);border-color:var(--accent)}
.form-err{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-top:10px}
.form-ok{color:var(--ok);padding:6px 0}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.visits{display:flex;flex-direction:column;gap:8px}
.visit{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.visit-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.visit-head b{font-weight:600}
.visit-head .sum{margin-left:auto;white-space:nowrap}
.visit-head button{padding:2px 8px;font-size:12px}
.visit ul{margin:4px 0 0;padding-left:18px}
.rec{color:var(--warn)}
select.status{font:inherit;font-size:13px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid transparent;cursor:pointer}
.status,.st{background:var(--bot);color:var(--muted)}
.st-1{background:rgba(37,99,235,.13);color:#1d4ed8}
.st-2{background:rgba(217,119,6,.15);color:#a35a00}
.st-3{background:rgba(22,163,74,.14);color:#15803d}
.st-4{background:rgba(71,85,105,.16);color:#334155}
.st-5{background:rgba(220,38,38,.12);color:#b91c1c}
.status-log{font-size:12px;color:var(--muted);margin:-6px 0 12px}
.line-add{display:flex;gap:8px;margin-top:8px}
.sec-head{display:flex;align-items:center;gap:8px}
.sec-head h3{flex:1}
.sec-head button,.plain-edit button{padding:2px 8px;font-size:12px}
.plain-edit{list-style:none;padding:0;margin:0}
.plain-edit li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.plain-edit li span{flex:1}
.plain-edit li span::before{content:"• ";color:var(--muted)}
.inline-add{display:flex;gap:6px;margin-top:6px}
.inline-add input{flex:1;min-width:0;font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.inline-add button{padding:4px 12px}
.empty .primary{margin-top:14px}
.form textarea{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-height:110px;resize:vertical}
.internal{margin-top:20px;border:1px dashed var(--line);border-radius:12px;padding:4px 14px 14px;background:var(--bg)}
.internal h3{margin-top:12px}
.comments{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.comment{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.comment .meta{font-size:12px;color:var(--muted);margin-bottom:2px}
.comment .meta b{color:var(--text);font-weight:600}
.comment-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.comment-form input,.comment-form textarea{font:inherit;font-size:14px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);min-width:0}
.comment-form textarea{grid-column:1 / -1;min-height:64px;resize:vertical}
.cc{font-size:11px;color:var(--muted);white-space:nowrap}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-bottom:10px}
.photo{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;min-width:0}
.photo a{display:block;aspect-ratio:4/3;background:var(--bg)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .pc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;padding:6px;font-size:12px}
.photo select{font:inherit;font-size:12px;padding:3px 4px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0;flex:1 1 100%}
.photo label{display:flex;align-items:center;gap:3px;white-space:nowrap}
.photo button{padding:1px 7px;font-size:12px;margin-left:auto}
.photo-add{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.photo-add select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text)}
.approval{border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px;background:var(--bg);border:1px solid var(--line)}
.approval.ok{color:var(--ok)}
.approval.no,.approval .warn{color:var(--warn)}
.approval .warn{display:block;margin-top:4px}
.tools-sec{border-top:1px solid var(--line);margin-top:18px;padding-top:4px}
.tools-sec .send-row{margin:8px 0}
.import-list{max-height:220px;overflow:auto;font-size:13px;margin:6px 0}
.import-list div{padding:2px 0}
.assignee{display:flex;align-items:center;gap:6px;margin:-4px 0 12px;font-size:13px;color:var(--muted)}
.assignee input{font:inherit;font-size:13px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-width:0;width:240px;max-width:100%}
.comment audio{display:block;width:100%;max-width:340px;height:36px;margin-top:4px}
.tg{font-size:12px;white-space:nowrap;color:var(--ok)}
.tg.off{color:var(--muted)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
.client-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.client-head h3{margin:0;font-size:18px;text-transform:none;letter-spacing:0;color:var(--text)}
.client-stats{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.client-stats div{background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px}
.client-stats b{display:block;font-size:16px}
.cars{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.car{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.car .sub{flex:1;min-width:160px}
.bc-form textarea{width:100%;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);min-height:120px;resize:vertical}
.bc-list{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0 10px;font-size:13px}
.bc-list label{display:flex;gap:6px;align-items:center;padding:3px 0}
.send-sec{border-top:1px solid var(--line);padding:12px 0 4px}
.send-sec:first-child{border-top:0;padding-top:4px}
.send-sec h3{margin:0 0 6px}
.send-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.qr{background:#fff;border-radius:12px;padding:10px;width:200px;height:200px;display:flex;align-items:center;justify-content:center}
.qr svg{width:100%;height:100%}
.qr-wrap{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.qr-wrap .link{flex:1;min-width:180px;word-break:break-all;font-size:12px;color:var(--muted)}
.ok-line{color:var(--ok);font-weight:600}
.form-warn{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;margin-top:10px}
button.danger-lite{color:var(--accent)}
.line-add button{font-size:13px;padding:5px 12px}
#orderBody td.acts button{padding:2px 7px;font-size:12px}
.ai-cost{font-size:12px;color:var(--muted);margin:-6px 0 12px}
.usage{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.usage-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 14px}
.usage-tile{background:var(--bot);border-radius:10px;padding:10px 12px}
.usage-tile b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.usage-tile span{color:var(--muted);font-size:12px}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bars i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:1px;opacity:.85}
.bars small{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap}
.filter-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.filter-chips button{font-size:12px;padding:4px 10px;border-radius:999px}
.filter-chips button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.send-icon{display:none;width:20px;height:20px}
.msg.user img{display:block;max-width:200px;max-height:200px;border-radius:8px;margin-bottom:4px}
@media (max-width:900px){
  .tabs{display:flex}
  main{grid-template-columns:minmax(0,1fr);padding:8px 16px 16px}
  main > .card{display:none}
  main > .card.show{display:flex}
  .info{grid-template-columns:1fr}
  #catalogList .hide-m,#orderBody .hide-m,#clientsBody .hide-m{display:none}
  #catalogList .show-m,#clientsBody .show-m{display:inline}
  #orderBody .show-m{display:block}
  #orderBody td.acts{white-space:nowrap}
  #catalogList th,#catalogList td{padding:6px 4px}
  .form{grid-template-columns:1fr;gap:4px}
  #send{width:48px;padding:0;display:flex;align-items:center;justify-content:center;flex:none}
  #send .send-label{display:none}
  #send .send-icon{display:block}
  .form label{padding-top:8px}
  header .label{display:none}
}
</style>
</head>
<body>
<header>
  <h1><span id="brand">DK-TeslaService</span> <span>· Замовлення-наряди</span></h1>
  <button id="btnCatalog" title="Довідник робіт">📚 <span class="label">Довідник</span></button>
  <button id="btnOrders" title="Збережені замовлення-наряди">📁 <span class="label">Збережені</span></button>
  <button id="btnClients" title="База клієнтів">👥 <span class="label">Клієнти</span></button>
  <button id="btnNew" title="Почати нове замовлення-наряд">＋ <span class="label">Нове</span></button>
  <button id="btnLogout" title="Вийти" hidden>⎋ <span class="label">Вийти</span></button>
</header>
<div class="tabs"><button data-tab="chat" class="on">Чат</button><button data-tab="order">Замовлення-наряд</button></div>
<main>
  <section id="chat" class="card show">
    <div class="log" id="log"></div>
    <div class="hints" id="hints">
      <button data-manual>📝 Заповнити вручну, без помічника</button>
    </div>
    <form class="composer" id="composer">
      <textarea id="input" rows="2" placeholder="Клієнт, автомобіль, скарги… (Enter — надіслати, Shift+Enter — новий рядок)"></textarea>
      <button type="button" class="mic" id="photoBtn" title="Фото VIN або одометра" aria-label="Фото VIN або одометра">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <input type="file" id="photoInput" accept="image/*" hidden>
      <button type="button" class="mic" id="mic" title="Голосове введення" aria-label="Голосове введення" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      </button>
      <button class="primary" id="send" aria-label="Надіслати"><span class="send-label">Надіслати</span><svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
    </form>
  </section>
  <section id="order" class="card"><div class="body" id="orderBody"></div></section>
</main>

<dialog id="catalogDlg">
  <div class="dh"><h2>Довідник</h2><button id="closeCatalog">✕</button></div>
  <div class="db">
    <div class="seg" id="catTabs">
      <button data-view="ops" class="on">Роботи</button><button data-view="parts">Запчастини</button><button data-view="settings">Налаштування</button>
    </div>
    <div id="catalogList">Завантаження…</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => Number(v).toLocaleString("uk-UA", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const dash = v => (v === null || v === undefined || v === "") ? "—" : esc(v);
let busy = false;
let STATUSES = ["чернетка", "прийнято", "в роботі", "готово", "видано", "скасовано"];
const usd = c => c > 0 && c < 0.01 ? "< $0,01" : "$" + Number(c || 0).toLocaleString("uk-UA",
  {minimumFractionDigits: 2, maximumFractionDigits: c < 1 ? 3 : 2});
const stClass = s => "st-" + Math.max(0, STATUSES.indexOf(s));

function md(text){
  // Мінімальна розмітка: абзаци, списки, **жирний**, `код`.
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  let html = "", list = null;
  for (const raw of text.split("\n")){
    const line = raw.trim();
    const m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m){ if (!list){ list = []; } list.push(`<li>${inline(m[1])}</li>`); continue; }
    if (list){ html += `<ul>${list.join("")}</ul>`; list = null; }
    if (line) html += `<p>${inline(line)}</p>`;
  }
  if (list) html += `<ul>${list.join("")}</ul>`;
  return html;
}

function addMsg(role, text){
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = role === "assistant" ? md(text) : esc(text).replace(/\n/g, "<br>");
  $("#log").appendChild(div);
  $("#log").scrollTop = $("#log").scrollHeight;
  return div;
}

function greet(){
  addMsg("assistant", "Вітаю! Опишіть клієнта, автомобіль (VIN, пробіг) і скарги — я підберу роботи та запчастини й оформлю замовлення-наряд.");
}

// Номер останнього замовлення-наряду в браузері: після перезапуску сервера відкриваємо його знову.
function remember(number){
  try{ number ? localStorage.setItem("lastOrder", number) : localStorage.removeItem("lastOrder"); }catch(e){}
}
function remembered(){
  try{ return localStorage.getItem("lastOrder"); }catch(e){ return null; }
}

let ASSIGNEES = [];
let currentOrder = null, TELEGRAM = false, BACKUP_CHAT = false, PHOTO_KINDS = ["до", "після", "пошкодження", "інше"];

// ---------- Внутрішні коментарі (не друкуються) ----------
function authorName(){ try{ return localStorage.getItem("author") || ""; }catch(e){ return ""; } }
function setAuthorName(v){ try{ localStorage.setItem("author", v); }catch(e){} }

function renderComments(list){
  const box = $("#internalBox");
  if (!box || !currentOrder) return;
  const typing = document.activeElement && document.activeElement.id === "cText" ? $("#cText").value : "";
  box.dataset.count = list.length;
  box.innerHTML = `<h3>💬 Внутрішні коментарі${list.length ? " · " + list.length : ""}</h3>
    <div class="sub" style="margin:-4px 0 10px">Лише для співробітників — у друковану форму не потрапляють.${TELEGRAM ? " Також з'являються в Telegram-групі, а відповіді там — тут." : ""}</div>
    <div class="comments">${list.map(c => `<div class="comment">
        <div class="meta"><b>${esc(c.author)}</b> · ${esc(c.at)} · ${c.source === "telegram" ? "📱 Telegram" : "🖥 сайт"}</div>
        <div>${esc(c.text).replace(/\n/g, "<br>")}</div>${c.voice ? `<audio controls preload="none" src="/voice/${encodeURIComponent(currentOrder.number)}/${esc(c.voice.file)}"></audio>
        <a class="sub" href="/voice/${encodeURIComponent(currentOrder.number)}/${esc(c.voice.file)}" download>⬇ завантажити запис</a>` : ""}</div>`).join("") || `<div class="sub">Коментарів ще немає.</div>`}</div>
    <form class="comment-form" id="commentForm">
      <textarea id="cText" placeholder="Що зроблено, що помітили, що лишилось…" aria-label="Коментар">${esc(typing)}</textarea>
      <input id="cAuthor" placeholder="Ваше ім'я" value="${esc(authorName())}" aria-label="Ваше ім'я">
      <button class="primary">Додати</button>
    </form>`;
  if (typing){ $("#cText").focus(); }
  $("#commentForm").onsubmit = async e => {
    e.preventDefault();
    const text = $("#cText").value.trim(), author = $("#cAuthor").value.trim();
    if (!text) return;
    if (!author){ $("#cAuthor").focus(); $("#cAuthor").placeholder = "Вкажіть ім'я"; return; }
    setAuthorName(author);
    try{
      const list2 = await api(`/api/orders/${encodeURIComponent(currentOrder.number)}/comments`,
                              {method: "POST", body: JSON.stringify({text, author})});
      $("#cText").value = "";
      document.activeElement.blur();
      renderComments(list2);
    }catch(err){ alert(err.message); }
  };
}

// Коментарі й фото з Telegram і відповідь клієнта на кошторис з'являються самі:
// раз на 20 секунд перевіряємо відкрите замовлення.
setInterval(async () => {
  if (!currentOrder || document.hidden || !$("#internalBox")) return;
  try{
    const x = await api(`/api/orders/${encodeURIComponent(currentOrder.number)}/extras`);
    if (String(x.comments.length) !== $("#internalBox").dataset.count) renderComments(x.comments);
    if (JSON.stringify(x.photos) !== JSON.stringify(currentOrder.photos || [])) renderPhotos(x.photos);
    if (JSON.stringify(x.approval) !== JSON.stringify(currentOrder.approval || null)) renderApproval(x.approval);
    // Статус чи відповідального змінили кнопками в Telegram-групі — оновлюємо панель.
    if (x.status && (x.status !== currentOrder.status || (x.assignee || "") !== (currentOrder.assignee || ""))
        && document.activeElement?.id !== "assigneeInp"){
      renderOrder((await api("/api/state")).order);
    }
  }catch(e){}
}, 20000);

// ---------- Погодження кошторису клієнтом ----------
function renderApproval(a){
  if (!currentOrder || !$("#approvalBox")) return;
  currentOrder.approval = a;
  const box = $("#approvalBox"), o = currentOrder;
  if (!a){ box.hidden = true; return; }
  box.hidden = false;
  const sum = `${num(a.total)} ${esc(a.currency || o.currency)}`;
  const changed = a.status !== "declined" && Math.abs(Number(a.total) - Number(o.totals.total)) > 0.004;
  const text = a.status === "approved" ? `✅ Клієнт погодив кошторис на ${sum} · ${esc(a.at)}`
    : a.status === "declined" ? `❌ Клієнт відмовився від кошторису на ${sum} · ${esc(a.at)}`
    : `⏳ Кошторис на ${sum} надіслано на погодження ${esc(a.sent_at)} — чекаємо відповіді клієнта`;
  box.className = "approval " + (a.status === "approved" ? "ok" : a.status === "declined" ? "no" : "");
  box.innerHTML = text + (changed ? `<span class="warn">⚠ Відтоді сума змінилась: зараз ${num(o.totals.total)} ${esc(o.currency)}. Надішліть кошторис на погодження ще раз (📤 Клієнту).</span>` : "");
}

// ---------- Фото до замовлення ----------
function renderPhotos(list){

  const n = encodeURIComponent(currentOrder.number);

    ${list.length ? `<div class="photos">${list.map(p => `<div class="photo">
        <a href="/photos/${n}/${esc(p.id)}" target="_blank" rel="noopener" title="${esc(p.author)} · ${esc(p.at)}"><img loading="lazy" alt="Фото: ${esc(p.kind)}" src="/photos/${n}/${esc(p.id)}"></a>
        <div class="pc"><select data-photo-kind="${esc(p.id)}" aria-label="Тип фото">${PHOTO_KINDS.map(k => `<option ${k === p.kind ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>

          <button data-photo-del="${esc(p.id)}" title="Видалити фото">✕</button></div>

    <div class="photo-add"><select id="photoKind" aria-label="Тип нових фото">${PHOTO_KINDS.map(k => `<option ${k === kind ? "selected" : ""}>${esc(k)}</option>`).join("")}</select>
      <button id="photoAdd">📷 Додати фото</button><span class="sub" id="photoNote"></span>
      <input type="file" id="photoFiles" accept="image/*" multiple hidden></div>`;
  $("#photoKind").onchange = e => { box.dataset.kind = e.target.value; };

const textList = (items, kind) => items.length

  const lines = (rows, isLabor) => rows.length ? rows.map((l, i) => {

async function api(path, opts = {}){
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, credentials: "same-origin", ...opts});
  const data = await r.json().catch(() => ({}));
  if (r.status === 401){ location.href = "/login"; throw new Error("Потрібно увійти"); }
  if (!r.ok) throw new Error(data.error || data.detail || `Помилка ${r.status}`);
  return data;
}

}

function stopVoice(discard = false){
  if (!recognizer) return;
  if (discard) recognizer.onresult = null;  // текст уже отправлен — пізні результати не потрібні
  recognizer.stop();
}

function startVoice(){
  if (!Recognition){
    addMsg("error", "Цей браузер не підтримує голосове введення. Скористайтеся мікрофоном на клавіатурі телефона або відкрийте сторінку в Chrome чи Safari.");
    return;
  }
  const input = $("#input");
  const base = input.value.trim() ? input.value.trim() + " " : "";
  const r = new Recognition();
  r.lang = "uk-UA";
  // Chrome на Android у безперервному режимі дублює фрази, тому там запис зупиняється після паузи.
  r.continuous = !/Android/i.test(navigator.userAgent);
  r.interimResults = true;
  r.onresult = e => {
    let text = "";
    for (const res of e.results) text += res[0].transcript;
    input.value = base + text.trim();
  };
  r.onerror = e => {
    const msg = {
      "not-allowed": "Немає доступу до мікрофона. Дозвольте його в налаштуваннях браузера для цього сайту.",
      "service-not-allowed": "Немає доступу до мікрофона. Дозвольте його в налаштуваннях браузера для цього сайту.",
      "audio-capture": "Мікрофон не знайдено.",
      "network": "Розпізнавання мовлення недоступне: немає з'єднання.",
    }[e.error];
    if (msg) addMsg("error", msg);
  };
  r.onend = () => { recognizer = null; setListening(false); input.focus(); };
  try{ r.start(); }catch(err){ addMsg("error", "Не вдалося увімкнути мікрофон: " + err.message); return; }
  recognizer = r;
  setListening(true);
}

async function send(text){
  text = text.trim();
  if (!text || busy) return;
  stopVoice(true);
  busy = true; $("#send").disabled = true;
  addMsg("user", text);
  $("#input").value = "";
  const typing = document.createElement("div");
  typing.className = "typing"; typing.textContent = "Помічник працює";
  $("#log").appendChild(typing); $("#log").scrollTop = $("#log").scrollHeight;
  try{
    const data = await api("/api/chat", {method: "POST", body: JSON.stringify({text})});
    typing.remove();
    if (data.reply) addMsg("assistant", data.reply);
    renderOrder(data.order);
  }catch(e){
    typing.remove();
    addMsg("error", e.message);
  }finally{
    busy = false; $("#send").disabled = false; $("#input").focus();
  }
}

    $("#addView").innerHTML = `<form class="form" id="customForm" autocomplete="off">

async function shrinkPhoto(file){
  // Зменшуємо до 1600 px по довшій стороні: так швидше й дешевше, а текст лишається читабельним.
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((resolve, reject) => {
      const i = new Image();
      i.onload = () => resolve(i);
      i.onerror = () => reject(new Error("Не вдалося відкрити фото"));
      i.src = url;
    });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(img.naturalWidth * k);
    canvas.height = Math.round(img.naturalHeight * k);
    canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.85);
  }finally{ URL.revokeObjectURL(url); }
}

const BC_TEMPLATES = {
  "Нагадування про ТО": "Добрий день, {ім'я}! Нагадуємо, що для {авто} настав час планового обслуговування. Запишіться до {сервіс}: {адреса}.",

  "Довільне": ""};
const tgBadge = c => c.telegram ? (c.telegram.blocked ? `<span class="tg off" title="Клієнт заблокував бота">🚫 заблокував</span>`
  : `<span class="tg" title="Підключився до бота ${esc(c.telegram.at)}">📲 Telegram</span>`) : "";
const dateOnly = d => d ? esc(String(d).split(" ")[0]) : "—";

function clientMatches(c){
  if (clientsFilter === "tg" && !(c.telegram && !c.telegram.blocked)) return false;
  if ((clientsFilter === "6" || clientsFilter === "12") && !(c.months != null && c.months >= Number(clientsFilter))) return false;
  const words = clientsQuery.toLowerCase().split(/\s+/).filter(Boolean);
  const digits = clientsQuery.replace(/\D/g, "");
  const hay = `${c.name} ${c.email} ${c.cars.map(x => `${x.vin} ${x.plate || ""} ${x.model || ""}`).join(" ")}`.toLowerCase();
  if (digits.length >= 3 && /^[\d\s+()-]+$/.test(clientsQuery.trim())) return c.phone.replace(/\D/g, "").includes(digits);
  return words.every(w => hay.includes(w));
}

    words.every(w => `${o.code} ${o.name} ${o.category} ${o.parts.map(p => p.name).join(" ")}`.toLowerCase().includes(w)));
  if (!ops.length){ $("#opsTable").innerHTML = `<div class="empty">Нічого не знайдено.</div>`; return; }
  let html = `<div class="tbl"><table><tr><th>Робота</th><th class="hide-m">Моделі</th><th class="r">Ціна роботи</th><th class="r">Запчастини</th><th></th></tr>`;
  let last = null;
  for (const o of [...ops].sort((a, b) => catalogData.categories.indexOf(a.category) - catalogData.categories.indexOf(b.category))){
    if (o.category !== last){ html += `<tr class="cat-row"><td colspan="5">${esc(o.category)}</td></tr>`; last = o.category; }
    html += `<tr><td>${esc(o.name)}<div class="sub">${esc(o.code)}${o.interval ? " · " + esc(o.interval) : ""}${o.parts.length ? " · " + o.parts.map(p => esc(p.name)).join(", ") : ""}<span class="show-m"> · ${esc(o.models)}</span></div></td>
      <td class="hide-m">${esc(o.models)}</td>
      <td class="r">${num(o.price)} ${cur}</td><td class="r">${o.parts.length ? num(o.parts_price) + " " + cur : "—"}</td>
      <td class="r acts"><button data-edit-op="${esc(o.code)}" title="Редагувати">✎</button> <button data-add="${esc(o.code)}" title="Додати до замовлення-наряду">＋</button></td></tr>`;
  }
  $("#opsTable").innerHTML = html + "</table></div>";
}

function renderPartsTable(){
  const cur = esc(catalogData.currency), q = partQuery.trim().toLowerCase();
  const parts = catalogData.parts.filter(p => !q || `${p.part_no} ${p.name}`.toLowerCase().includes(q));
  $("#partsTable").innerHTML = parts.length ? `<div class="tbl"><table>
    <tr><th>Запчастина</th><th class="r">Ціна</th><th class="hide-m">Од.</th><th class="r hide-m">У роботах</th><th></th></tr>
    ${parts.map(p => `<tr><td>${esc(p.name)}<div class="sub">${esc(p.part_no)}<span class="show-m"> · ${esc(p.unit)}</span></div></td>
      <td class="r">${num(p.price)} ${cur}</td><td class="hide-m">${esc(p.unit)}</td><td class="r hide-m">${p.used || "—"}</td>
      <td class="r"><button data-edit-part="${esc(p.part_no)}" title="Редагувати">✎</button></td></tr>`).join("")}

function formError(msg){
  const box = $("#formErr");
  box.hidden = !msg; box.textContent = msg || "";
  if (msg) box.scrollIntoView({block: "nearest"});
}

async function saveCatalog(method, url, body, flash, view){
  try{
    setCatalog(await api(url, {method, body: body ? JSON.stringify(body) : undefined}));
    catFlash = flash;
    showCatalog(view);
    return true;
  }catch(e){ formError(e.message); return false; }
}

function opForm(code){
  const o = code ? catalogData.operations.find(x => x.code === code) : null;
  const models = o ? o.model_codes : ["*"];
  let parts = o ? o.parts.map(p => p.part_no) : [];
  const partName = no => (catalogData.parts.find(p => p.part_no === no) || {name: no}).name;
  $("#catalogList").innerHTML = `<h3>${o ? "Редагування роботи" : "Нова робота"}</h3>
    <form class="form" id="opForm" autocomplete="off">
      <label for="fCode">Код</label>
      <div><input id="fCode" value="${esc(o ? o.code : "")}" ${o ? "disabled" : ""} placeholder="напр. BRK-PAD-F">
        ${o ? "" : `<div class="hint">Латинські літери, цифри, дефіс. Потім змінити не можна.</div>`}</div>
      <label for="fName">Назва</label><input id="fName" value="${esc(o ? o.name : "")}">
      <label for="fCat">Розділ</label><input id="fCat" list="catCategories" value="${esc(o ? o.category : catCategory)}" placeholder="оберіть або введіть новий">
      <label for="fPrice">Ціна роботи, ${esc(catalogData.currency)}</label><input id="fPrice" inputmode="decimal" value="${o ? fmtNum(o.price) : ""}" placeholder="напр. 80">
      <label>Моделі</label>
      <div class="checks" id="fModels">
        <label><input type="checkbox" value="*" ${models.includes("*") ? "checked" : ""}> усі</label>
        ${catalogData.models.map(m => `<label><input type="checkbox" value="${m.code}" ${models.includes(m.code) ? "checked" : ""}> ${esc(m.name)}</label>`).join("")}
      </div>
      <label>Запчастини</label>
      <div><div class="chips" id="fParts"></div>
        <div class="row"><select id="fPartSel"><option value="">— додати запчастину —</option>
          ${catalogData.parts.map(p => `<option value="${esc(p.part_no)}">${esc(p.name)} (${esc(p.part_no)})</option>`).join("")}</select></div></div>
      <label for="fInterval">Інтервал ТО</label><input id="fInterval" value="${esc(o ? o.interval : "")}" placeholder="напр. кожні 2 роки (необов'язково)">
      <span></span>
      <div><div class="form-err" id="formErr" hidden></div>
        <div class="form-actions"><button class="primary" type="submit">Зберегти</button><button type="button" data-cancel>Скасувати</button>
        ${o ? `<button type="button" class="danger" data-delete>Видалити</button>` : ""}</div></div>
    </form>`;
  const drawParts = () => $("#fParts").innerHTML = parts.length
    ? parts.map(no => `<span class="chip">${esc(partName(no))}<button type="button" data-rm="${esc(no)}" title="Прибрати">✕</button></span>`).join("")
    : `<span class="sub">без запчастин</span>`;
  drawParts();
  const syncModels = () => {
    const all = $('#fModels input[value="*"]').checked;
    document.querySelectorAll('#fModels input:not([value="*"])').forEach(c => c.disabled = all);
  };
  syncModels();
  $("#fModels").onchange = syncModels;
  $("#fPartSel").onchange = e => { const v = e.target.value; if (v && !parts.includes(v)) parts.push(v); e.target.value = ""; drawParts(); };
  $("#fParts").onclick = e => { const no = e.target.dataset.rm; if (no){ parts = parts.filter(x => x !== no); drawParts(); } };
  $("#opForm").onsubmit = e => {
    e.preventDefault();
    const all = $('#fModels input[value="*"]').checked;
    const body = {
      code: $("#fCode").value, name: $("#fName").value, category: $("#fCat").value, price: $("#fPrice").value,
      models: all ? ["*"] : [...document.querySelectorAll('#fModels input:checked')].map(c => c.value),
      parts, interval: $("#fInterval").value,
    };
    if (o) saveCatalog("PUT", `/api/catalog/operations/${encodeURIComponent(o.code)}`, body, `Роботу «${body.name}» збережено`, "ops");
    else saveCatalog("POST", "/api/catalog/operations", body, `Роботу «${body.name}» додано`, "ops");
  };
  $("#opForm [data-cancel]").onclick = () => showCatalog("ops");
  if (o) $("#opForm [data-delete]").onclick = () => {
    if (confirm(`Видалити роботу «${o.name}» з довідника?`))
      saveCatalog("DELETE", `/api/catalog/operations/${encodeURIComponent(o.code)}`, null, `Роботу «${o.name}» видалено`, "ops");
  };
  $("#fName").focus();
}

async function importExcel(file, apply){
  const box = $("#xlsxResult");
  box.innerHTML = `<div class="sub">${apply ? "Застосовую…" : "Перевіряю файл…"}</div>`;
  let r;
  try{
    const resp = await fetch(`/api/catalog/import${apply ? "?apply=true" : ""}`, {method: "POST", body: file, credentials: "same-origin",
                                                                              headers: {"Content-Type": "application/octet-stream"}});
    r = await resp.json().catch(() => ({}));
    if (!resp.ok) throw new Error(r.error || `Помилка ${resp.status}`);
  }catch(err){ box.innerHTML = `<div class="form-err">${esc(err.message)}</div>`; return; }
  if (apply){
    if (r.catalog) setCatalog(r.catalog);
    catFlash = `Прайс оновлено: робіт ${r.operations.length}, запчастин ${r.parts.length}`;
    showCatalog("settings");
    return;
  }
  const row = x => `<div>${x.action === "new" ? "＋ нова" : "✎ змінено"} · <b>${esc(x.code)}</b> ${esc(x.name)} · ${num(x.price)} $${x.changes.length ? ` <span class="sub">(${x.changes.map(esc).join(", ")})</span>` : ""}</div>`;
  const total = r.operations.length + r.parts.length;
  box.innerHTML = `
    ${total ? `<div class="import-list">${r.operations.length ? `<b>Роботи: ${r.operations.length}</b>${r.operations.map(row).join("")}` : ""}
      ${r.parts.length ? `<b>Запчастини: ${r.parts.length}</b>${r.parts.map(row).join("")}` : ""}</div>` : `<div class="sub">Змін немає — прайс у файлі збігається з довідником.</div>`}
    ${r.errors.length ? `<div class="form-err">Рядки з помилками (не буде застосовано):<div class="import-list">${r.errors.map(x => `<div>«${esc(x.sheet)}», рядок ${x.row}: ${esc(x.message)}</div>`).join("")}</div></div>` : ""}
    ${total ? `<div class="send-row"><button type="button" class="primary" id="xlsxApply">Застосувати зміни (${total})</button><button type="button" id="xlsxCancel">Скасувати</button></div>` : ""}`;
  if (total){
    $("#xlsxApply").onclick = () => importExcel(file, true);
    $("#xlsxCancel").onclick = () => { box.innerHTML = ""; };
  }
}

async function loadUsage(){
  try{
    const u = await api("/api/usage");
    const tile = (label, v) => `<div class="usage-tile"><b>${usd(v.cost_usd)}</b><span>${label} · запитів: ${v.requests}</span></div>`;
    const max = Math.max(...u.by_day.map(d => d.cost_usd), 0.0001);
    $("#usageBox").innerHTML = `<h3>Витрати на Claude</h3>
      <div class="usage-grid">${tile("сьогодні", u.today)}${tile("цей місяць", u.month)}${tile("усього", u.all)}
        <div class="usage-tile"><b>${usd(u.avg_per_order)}</b><span>у середньому на замовлення-наряд (${u.orders})</span></div></div>
      <div class="sub">По днях за 2 тижні</div>
      <div class="bars">${u.by_day.map(d => `<div title="${esc(d.day)}: ${usd(d.cost_usd)}, запитів: ${d.requests}">
        <i style="height:${Math.round(d.cost_usd / max * 100)}%"></i><small>${esc(d.day.slice(8))}</small></div>`).join("")}</div>
      <div class="hint">Оцінка за тарифами моделі й фактичними токенами з відповідей API. Точна сума — у console.anthropic.com → Usage.</div>`;
  }catch(e){ $("#usageBox").innerHTML = `<h3>Витрати на Claude</h3><div class="sub">${esc(e.message)}</div>`; }
}

  $("#catalogDlg").showModal();
  try{
    setCatalog(await api("/api/catalog"));  // щоразу свіжі дані: довідник могли змінити інші

};
$("#catTabs").onclick = e => { const v = e.target.dataset.view; if (v && catalogData) showCatalog(v); };
$("#closeCatalog").onclick = () => $("#catalogDlg").close();
$("#catalogList").addEventListener("click", e => {
  const d = e.target.dataset;
  if (d.download) return void (location.href = d.download);
  if (d.newOp !== undefined) return opForm(null);
  if (d.editOp) return opForm(d.editOp);
  if (d.newPart !== undefined) return partForm(null);
  if (d.editPart) return partForm(d.editPart);
  if (!d.add) return;
  const op = catalogData.operations.find(o => o.code === d.add);
  $("#catalogDlg").close();
  document.querySelector('.tabs button[data-tab="chat"]').click();
  send(`Додай роботу ${op.code} — ${op.name}`);
});
$("#btnNew").onclick = async () => {
  if (busy) return;
  await api("/api/reset", {method: "POST"});
  remember(null);

};
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {

(async () => {
  try{
    const s = await api("/api/state");
    if (s.auth) $("#btnLogout").hidden = false;
    if (s.statuses) STATUSES = s.statuses;
    TELEGRAM = !!s.telegram;
    BACKUP_CHAT = !!s.backup_chat;
    ASSIGNEES = s.assignees || [];
    if (s.photo_kinds) PHOTO_KINDS = s.photo_kinds;
    if (s.service) SERVICE_ADDRESS = s.service.address || "";
    if (s.service && s.service.name){ $("#brand").textContent = s.service.name; document.title = s.service.name; }
    if (s.history.length) s.history.forEach(m => addMsg(m.role, m.text));
    const last = remembered();
    if (!s.order && last){
      // Сервер перезапускався і забув розмову — відкриваємо автоматично збережену чернетку.
      try{
        const data = await api(`/api/orders/${encodeURIComponent(last)}/open`, {method: "POST"});
        addMsg("assistant", `Відновлено замовлення-наряд № ${last}. Попередню розмову не збережено — продовжуйте з того місця, де зупинилися.`);
        renderOrder(data.order);
        return;
      }catch(e){ remember(null); }
    }
    if (!s.history.length) greet();
    renderOrder(s.order);
  }catch(e){ greet(); renderOrder(null); addMsg("error", e.message); }
})();
