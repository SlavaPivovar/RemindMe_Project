<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="<!--SHORT-->">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a20" media="(prefers-color-scheme: dark)">
<title>Вхід · <!--NAME--></title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#16181d;--muted:#6b7280;--line:#e3e5e9;--accent:#d32f2f;--err:#b42318;--ok:#1b7f3b}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1115;--panel:#171a20;--text:#e8eaed;--muted:#9aa1ad;--line:#2a2f38;--accent:#ef5350;--err:#f97066;--ok:#5fd38a}
}
:root[data-theme="dark"]{--bg:#0f1115;--panel:#171a20;--text:#e8eaed;--muted:#9aa1ad;--line:#2a2f38;--accent:#ef5350;--err:#f97066;--ok:#5fd38a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
.box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 24px}
h1{font-size:19px;margin:0 0 4px}
p{margin:0 0 16px;color:var(--muted);font-size:14px}
.seg{display:flex;gap:4px;margin:0 0 16px}
.seg button{flex:1;background:var(--bg);color:var(--text);border:1px solid var(--line);padding:9px 6px;font-size:14px}
.seg button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
input{width:100%;font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:12px}
button{width:100%;font:inherit;padding:11px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--err);margin:-4px 0 12px;font-size:14px}
.ok{color:var(--ok);margin:-4px 0 12px;font-size:14px}
.hint{font-size:12px;color:var(--muted);margin:10px 0 0}
[hidden]{display:none !important}
</style>
</head>
<body>
<div class="box">
  <h1><!--NAME--></h1>
  <p>Вхід для співробітників сервісу</p>
  <div class="seg" id="seg"><button type="button" data-mode="code">Код у Telegram</button><button type="button" data-mode="pwd">Пароль</button></div>

  <form id="codeForm" autocomplete="on">
    <label for="cPhone">Ваш телефон</label>
    <input id="cPhone" type="tel" inputmode="tel" placeholder="+380…" autocomplete="tel" required>
    <div id="codeStep" hidden>
      <div class="ok" id="codeSent"></div>
      <label for="cCode">Код із Telegram</label>
      <input id="cCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 цифр">
    </div>
    <div class="err" id="codeErr" hidden></div>
    <button id="codeBtn">Отримати код</button>
    <p class="hint">Код надсилає бот сервісу у ваш Telegram. Щоб підключити Telegram, відкрийте посилання-запрошення від власника.</p>
  </form>

  <form id="pwdForm" method="post" action="/login" hidden>
    <label for="pPhone">Телефон <span>(порожньо — вхід власника за паролем сервісу)</span></label>
    <input id="pPhone" name="phone" type="tel" inputmode="tel" placeholder="+380…" autocomplete="tel">
    <label for="pPwd">Пароль</label>
    <input id="pPwd" type="password" name="password" placeholder="Пароль" autocomplete="current-password" required>
    <!--ERROR-->
    <button>Увійти</button>
  </form>
</div>
<script>
const TELEGRAM = "<!--TELEGRAM-->" === "1";
const $ = s => document.querySelector(s);
const params = new URLSearchParams(location.search);
function mode(m){
  document.querySelectorAll("#seg button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("#codeForm").hidden = m !== "code"; $("#pwdForm").hidden = m !== "pwd";
  (m === "code" ? $("#cPhone") : (params.get("phone") ? $("#pPhone") : $("#pPwd"))).focus();
}
if (!TELEGRAM){ $("#seg").hidden = true; mode("pwd"); } else mode(params.get("error") ? "pwd" : "code");
$("#seg").onclick = e => { if (e.target.dataset.mode) mode(e.target.dataset.mode); };
try{ const saved = localStorage.getItem("loginPhone"); if (saved) $("#cPhone").value = saved; }catch(e){}
let step = "phone";
$("#codeForm").onsubmit = async e => {
  e.preventDefault();
  const err = m => { $("#codeErr").hidden = !m; $("#codeErr").textContent = m || ""; };
  const phone = $("#cPhone").value.trim();
  if (!phone) return;
  $("#codeBtn").disabled = true; err("");
  try{
    const url = step === "phone" ? "/login/code" : "/login/verify";
    const body = step === "phone" ? {phone} : {phone, code: $("#cCode").value.trim()};
    const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || "Помилка " + r.status);
    try{ localStorage.setItem("loginPhone", phone); }catch(x){}
    if (step === "phone"){
      step = "code"; $("#codeStep").hidden = false; $("#codeSent").textContent = `✓ ${d.name}, код надіслано в Telegram`;
      $("#codeBtn").textContent = "Увійти"; $("#cCode").focus();
    } else location.href = "/";
  }catch(x){ err(x.message); }
  $("#codeBtn").disabled = false;
};
$("#cPhone").oninput = () => { if (step === "code"){ step = "phone"; $("#codeStep").hidden = true; $("#codeBtn").textContent = "Отримати код"; } };
</script>
</body>
</html>
