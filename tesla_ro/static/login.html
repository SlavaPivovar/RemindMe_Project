<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вхід · <!--NAME--></title>
<style>
:root{--bg:#f4f5f7;--panel:#fff;--text:#16181d;--muted:#6b7280;--line:#e3e5e9;--accent:#d32f2f;--err:#b42318}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0f1115;--panel:#171a20;--text:#e8eaed;--muted:#9aa1ad;--line:#2a2f38;--accent:#ef5350;--err:#f97066}
}
:root[data-theme="dark"]{--bg:#0f1115;--panel:#171a20;--text:#e8eaed;--muted:#9aa1ad;--line:#2a2f38;--accent:#ef5350;--err:#f97066}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px}
h1{font-size:18px;margin:0 0 4px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
input{width:100%;font:inherit;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:12px}
button{width:100%;font:inherit;padding:11px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.err{color:var(--err);margin:-4px 0 12px}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1><!--NAME--></h1>
  <p>Замовлення-наряди · введіть пароль сервісу</p>
  <input type="password" name="password" placeholder="Пароль" autocomplete="current-password" autofocus required>
  <!--ERROR-->
  <button>Увійти</button>
</form>
</body>
</html>
